<style>
.ct-wrap{max-width:640px;margin:0 auto;padding:4px 0 40px}
.ct-hero{position:relative;padding:26px 22px;border-radius:20px;background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-soft);margin-bottom:16px;overflow:hidden}
.ct-hero::before{content:"";position:absolute;top:-80px;right:-80px;width:220px;height:220px;background:radial-gradient(circle,var(--primary-glow) 0%,transparent 70%);opacity:.35;pointer-events:none}
.ct-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ct-avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--border-strong);object-fit:cover;background:var(--surface-3);flex-shrink:0;filter:grayscale(.3);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.ct-info{flex:1;min-width:180px}
.ct-info h2{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;background:linear-gradient(135deg,#fff,#a8b2d1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ct-role{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--primary-soft);border:1px solid var(--border-strong);color:var(--primary);font-size:10.5px;font-weight:600;font-family:var(--font-mono);letter-spacing:.4px}
.ct-status{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:var(--font-mono);margin-top:10px}
.ct-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:ctPulse 1.5s ease infinite}
@keyframes ctPulse{0%,100%{opacity:1}50%{opacity:.4}}
.ct-bio{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ct-label{font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:1.5px;text-transform:uppercase;padding:16px 4px 10px;font-family:var(--font-mono)}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct-item{position:relative;padding:16px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--border);transition:all .3s var(--ease-out);text-align:left;overflow:hidden;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer;width:100%}
.ct-item::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ct-color,var(--primary));opacity:0;transition:opacity .3s}
.ct-item:hover::before,.ct-item:active::before{opacity:1}
.ct-item:active{transform:scale(.96)}
.ct-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:18px;color:#fff;background:var(--ct-color,var(--surface-3));box-shadow:0 6px 16px rgba(0,0,0,.35);flex-shrink:0}
.ct-body{display:flex;flex-direction:column;gap:3px}
.ct-body span{font-size:12.5px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.ct-body small{font-size:10.5px;color:var(--muted-2);font-family:var(--font-mono);line-height:1.4}
.ct-arrow{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:8px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;font-size:10px;color:var(--muted-2);transition:all .3s}
.ct-item:hover .ct-arrow{color:var(--ct-color,var(--primary));transform:translate(2px,-2px)}
.ct-feature{padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(108,124,255,.08),rgba(139,92,246,.03));border:1px solid var(--border-strong);margin-top:14px;display:flex;gap:14px;align-items:flex-start}
.ct-feature-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;font-size:20px;color:#000;flex-shrink:0;box-shadow:0 8px 20px var(--primary-glow);font-weight:700}
.ct-feature-body h4{font-size:13.5px;font-weight:700;margin-bottom:4px}
.ct-feature-body p{font-size:11.5px;color:var(--muted);line-height:1.55}
</style>

<div class="ct-wrap">
  <div class="ct-hero">
    <div class="ct-hero-inner">
      <img class="ct-avatar" id="ctAvatar" alt="Avatar" onerror="this.style.display='none'">
      <div class="ct-info">
        <h2 id="ctName">-</h2>
        <div class="ct-role"><i class="fa-solid fa-bolt"></i> <span id="ctRole">Developer</span></div>
        <div class="ct-status">Available</div>
      </div>
    </div>
    <p class="ct-bio" id="ctBio">-</p>
  </div>

  <div class="ct-label">Hubungi Via</div>
  <div class="ct-grid">
    <a class="ct-item" id="ctWa" target="_blank" rel="noopener" style="--ct-color:#25d366">
      <div class="ct-icon"><i class="fa-brands fa-whatsapp"></i></div>
      <div class="ct-body">
        <span>WhatsApp</span>
        <small>Chat langsung</small>
      </div>
      <div class="ct-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
    </a>
    <a class="ct-item" id="ctChannel" target="_blank" rel="noopener" style="--ct-color:#10b981">
      <div class="ct-icon"><i class="fa-solid fa-bullhorn"></i></div>
      <div class="ct-body">
        <span>Saluran</span>
        <small>Info & update</small>
      </div>
      <div class="ct-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
    </a>
    <button class="ct-item" data-sidebar="about" style="--ct-color:var(--primary)">
      <div class="ct-icon"><i class="fa-solid fa-user-astronaut"></i></div>
      <div class="ct-body">
        <span>About Dev</span>
        <small>Profil lengkap</small>
      </div>
      <div class="ct-arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </button>
    <button class="ct-item" data-sidebar="lapor" style="--ct-color:#f59e0b">
      <div class="ct-icon"><i class="fa-solid fa-bullhorn"></i></div>
      <div class="ct-body">
        <span>Lapor Bug</span>
        <small>Kirim masukan</small>
      </div>
      <div class="ct-arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </button>
  </div>

  <div class="ct-feature">
    <div class="ct-feature-icon"><i class="fa-solid fa-comments"></i></div>
    <div class="ct-feature-body">
      <h4>Fast Response</h4>
      <p>Biasanya admin balas dalam 1×24 jam. Buat respon cepat, kirim pesan via WhatsApp.</p>
    </div>
  </div>
</div>

<script>
(function(){
  const data = window.getCloudData(); if(!data) return;
  const d = data.preferences?.developer || {};
  const c = data.preferences?.contact || {};
  const $ = window.$;

  const setTxt = (id, v) => { const el = $(id); if(el) el.textContent = v || ""; };
  const setSrc = (id, v) => { const el = $(id); if(el) el.src = v || ""; };
  const setHref = (id, v) => { const el = $(id); if(el) el.href = v || "#"; };

  setSrc("#ctAvatar", d.profileImage);
  setTxt("#ctName", d.name);
  setTxt("#ctRole", d.role);
  setTxt("#ctBio", d.description);
  setHref("#ctWa", c.whatsapp);
  setHref("#ctChannel", c.channel);
})();
</script>
