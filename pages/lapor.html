<style>
.lp-wrap{max-width:640px;margin:0 auto;padding:4px 0 40px}
.lp-header{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--border-strong);margin-bottom:14px;display:flex;align-items:flex-start;gap:14px}
.lp-header-icon{width:48px;height:48px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;font-size:20px;color:#000;box-shadow:0 8px 20px var(--primary-glow);font-weight:700}
.lp-header h2{font-size:16px;font-weight:700;margin-bottom:4px}
.lp-header p{font-size:11.5px;color:var(--muted);line-height:1.55}
.lp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lp-card{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.lp-label{font-size:9.5px;font-weight:700;color:var(--muted-2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-family:var(--font-mono)}
.lp-value{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;font-family:var(--font-mono)}
.lp-value.green{color:#4ade80}
.lp-value .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:lpPulse 1.5s ease infinite}
@keyframes lpPulse{0%,100%{opacity:1}50%{opacity:.4}}
.lp-form{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lp-field{display:flex;flex-direction:column;gap:7px}
.lp-field label{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-family:var(--font-mono)}
.lp-field label .req{color:#f87171;margin-left:2px}
.lp-field input,.lp-field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:13px;line-height:1.4;outline:none;transition:all .25s}
.lp-field input:focus,.lp-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.lp-field input::placeholder{color:var(--muted-2);font-size:12px}
.lp-input-wrap{padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);margin-top:14px}
.lp-input-row{display:flex;gap:8px;align-items:flex-end}
.lp-input{flex:1;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:13px;line-height:1.4;resize:none;min-height:50px;max-height:120px;outline:none}
.lp-input::placeholder{color:var(--muted-2)}
.lp-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.lp-send{width:46px;height:46px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;display:grid;place-items:center;font-size:15px;box-shadow:0 6px 16px var(--primary-glow);font-weight:700;cursor:pointer;border:none}
.lp-send:active{transform:scale(.94)}
.lp-send:disabled{opacity:.5;cursor:not-allowed}
.lp-meta{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0;font-size:10px;font-family:var(--font-mono);color:var(--muted-2)}
</style>

<div class="lp-wrap">
  <div class="lp-header">
    <div class="lp-header-icon"><i class="fa-solid fa-comments"></i></div>
    <div>
      <h2>Lapor Bug, Saran & Ide</h2>
      <p>Kirim laporan atau masukan. Balasan admin muncul segera.</p>
    </div>
  </div>

  <div class="lp-grid">
    <div class="lp-card">
      <div class="lp-label">Nama / Username</div>
      <div class="lp-value" id="lpUserDisplay">@-</div>
    </div>
    <div class="lp-card">
      <div class="lp-label">Sisa Pesan</div>
      <div class="lp-value" id="lpQuota">-</div>
    </div>
  </div>

  <div class="lp-card">
    <div class="lp-label">Status Balasan</div>
    <div class="lp-value green"><span class="dot"></span> Balasan aktif</div>
  </div>

  <form class="lp-form" id="lpForm" novalidate>
    <div class="lp-field">
      <label>Nama / Username <span class="req">*</span></label>
      <input type="text" id="lpName" maxlength="40" placeholder="Tulis username lu..." autocomplete="off">
    </div>
    <div class="lp-field">
      <label>Kategori</label>
      <select id="lpCat">
        <option value="Bug Report">Lapor Bug</option>
        <option value="Saran Fitur">Saran Fitur Baru</option>
        <option value="Ide">Ide / Masukan</option>
        <option value="Kritik">Kritik</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>
  </form>

  <div class="lp-input-wrap">
    <div class="lp-input-row">
      <textarea class="lp-input" id="lpMsg" maxlength="500" placeholder="Tulis report bug, saran, atau ide..."></textarea>
      <button class="lp-send" id="lpSubmit" type="button"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="lp-meta">
      <span id="lpSession">Sesi 00:00</span>
      <span><span id="lpCount">0</span> / 500</span>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = window.$;
  const toast = window.toast;
  const getRemainingLapor = window.getRemainingLapor;
  const incrementLapor = window.incrementLapor;
  const getCloudData = window.getCloudData;

  const nameEl = $("#lpName");
  const catEl = $("#lpCat");
  const msgEl = $("#lpMsg");
  const countEl = $("#lpCount");
  const submitBtn = $("#lpSubmit");

  try{
    const lastName = localStorage.getItem("msi_lapor_name") || "";
    if(lastName){
      nameEl.value = lastName;
      $("#lpUserDisplay").textContent = "@" + lastName;
    }
  }catch(e){}

  const updateQuota = () => {
    const rem = getRemainingLapor();
    const data = getCloudData();
    const limit = data?.preferences?.dailyLimit || 5;
    const q = $("#lpQuota");
    if(q) q.textContent = rem + "/" + limit;
    if(rem <= 0){ submitBtn.disabled = true; submitBtn.style.opacity = "0.5"; }
  };
  updateQuota();

  msgEl.addEventListener("input", () => { countEl.textContent = msgEl.value.length; });
  nameEl.addEventListener("input", () => {
    const v = nameEl.value.trim();
    $("#lpUserDisplay").textContent = v ? "@" + v : "@-";
  });

  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const m = Math.floor(s/60), ss = s % 60;
    const el = $("#lpSession");
    if(el) el.textContent = "Sesi " + String(m).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
  }, 1000);

  submitBtn.onclick = async () => {
    if(getRemainingLapor() <= 0){ toast("Kuota habis.","error"); return; }
    const nama = nameEl.value.trim();
    if(!nama){ toast("Isi nama dulu.","error"); nameEl.focus(); return; }
    const pesan = msgEl.value.trim();
    if(pesan.length < 5){ toast("Min 5 karakter.","error"); msgEl.focus(); return; }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try{ localStorage.setItem("msi_lapor_name", nama); }catch(e){}

    const ok = await sendToDiscord({ nama, kategori: catEl.value, pesan });

    if(ok){
      incrementLapor({ nama, kategori: catEl.value, pesan: pesan.slice(0,100) });
      toast("Terkirim. Makasih!","success");
      msgEl.value = ""; countEl.textContent = "0"; updateQuota();
    } else toast("Gagal kirim.","error");

    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
  };

async function sendToDiscord(payload){
  const data = getCloudData();
  const url = data?.preferences?.webhookSaran || "";
  if(!url || !/^https:\/\/discord(app)?\.com\/api\/webhooks\//.test(url)) return false;

  const LOGO = "https://i.ibb.co.com/twHc7kkk/Proyek-Baru-14-B060999.png";
  const now = new Date();
  const months = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const tanggal = `${String(now.getDate()).padStart(2,"0")} ${months[now.getMonth()]} ${now.getFullYear()}, ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  const catMap = {
    "Bug Report":   { emoji: "🦠", color: 0xef4444, label: "BUG REPORT",       tag: "PRIORITY" },
    "Saran Fitur":  { emoji: "💡", color: 0xf59e0b, label: "FEATURE REQUEST",  tag: "SUGGESTION" },
    "Ide":          { emoji: "✨", color: 0x8b5cf6, label: "IDEA DROP",        tag: "CREATIVE" },
    "Kritik":       { emoji: "📝", color: 0x6b7280, label: "CRITIQUE",         tag: "FEEDBACK" },
    "Request Jasa": { emoji: "🎯", color: 0x06b6d4, label: "SERVICE REQUEST",  tag: "ORDER" },
    "Kerja Sama":   { emoji: "🤝", color: 0x22c55e, label: "PARTNERSHIP",      tag: "COLLAB" },
    "Lainnya":      { emoji: "📨", color: 0x6c7cff, label: "GENERAL MESSAGE",  tag: "MISC" }
  };
  const cat = catMap[payload.kategori] || catMap["Lainnya"];

  const nama = (payload.nama || "Anonim").slice(0, 90);
  const pesan = (payload.pesan || "").slice(0, 1000);
  const pesanLen = pesan.length;

  const body = {
    username: "MSI ASTRA FORM",
    avatar_url: LOGO,
    allowed_mentions: { parse: [] },
    embeds: [{
      author: {
        name: "◆  MSI ASTRA  ·  FEEDBACK SYSTEM",
        icon_url: LOGO
      },
      title: `${cat.emoji}  ${cat.label}`,
      description:
        `\`\`\`yaml\n` +
        `Pengirim : ${nama}\n` +
        `Kategori : ${payload.kategori || "Lainnya"}\n` +
        `Waktu    : ${tanggal}\n` +
        `\`\`\``,
      color: cat.color,
      thumbnail: { url: LOGO },

      fields: [
        {
          name: "❯  INFORMASI PENGIRIM",
          value:
            `**Nama**  ·  \`${nama}\`\n` +
            `**ID Tag**  ·  \`${cat.tag}\`\n` +
            `**Channel**  ·  \`MSI ASTRA\``,
          inline: true
        },
        {
          name: "❯  DETAIL PESAN",
          value:
            `**Tipe**  ·  \`${payload.kategori || "-"}\`\n` +
            `**Panjang**  ·  \`${pesanLen} karakter\`\n` +
            `**Status**  ·  🟢 \`Received\``,
          inline: true
        },
        {
          name: "❯  ISI PESAN",
          value: `\`\`\`\n${pesan}\n\`\`\``,
          inline: false
        }
      ],

      footer: {
        text: "MSI ASTRA  ✦  FORM  ✦  v5.3",
        icon_url: LOGO
      },
      timestamp: now.toISOString()
    }]
  };

  const jsonStr = JSON.stringify(body);
  if(navigator.sendBeacon){
    try{
      const blob = new Blob([jsonStr], { type: "application/json" });
      if(navigator.sendBeacon(url, blob)) return true;
    }catch(e){}
  }
  try{
    fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: jsonStr }).catch(()=>{});
    return true;
  }catch(e){ return false; }
}
})();
</script>
