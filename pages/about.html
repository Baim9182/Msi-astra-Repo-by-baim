<style>
.ab-wrap{max-width:720px;margin:0 auto;padding:4px 0 40px}
.ab-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;animation:abFadeUp .5s var(--ease-out) both}
.ab-name{font-size:20px;font-weight:800;letter-spacing:-.4px;font-family:var(--font-mono)}
.ab-name .sep{color:var(--muted-2);font-weight:400;margin:0 6px}
.ab-status{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-size:10px;font-weight:600;letter-spacing:.4px;flex-shrink:0;font-family:var(--font-mono)}
.ab-status::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:abPulse 1.5s ease infinite}
@keyframes abPulse{0%,100%{opacity:1}50%{opacity:.4}}
.ab-tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:24px;overflow-x:auto;scrollbar-width:none;animation:abFadeUp .5s var(--ease-out) .1s both}
.ab-tabs::-webkit-scrollbar{display:none}
.ab-tab{flex:1;min-width:70px;padding:9px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;background:transparent;cursor:pointer;font-family:var(--font-mono);border:none;transition:all .25s}
.ab-tab i{font-size:12px}
.ab-tab.active{background:var(--surface-3);color:var(--text)}
.ab-hero{display:flex;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.ab-avatar{width:120px;height:120px;border-radius:50%;border:2px solid var(--border-strong);object-fit:cover;background:var(--surface-3);box-shadow:0 12px 32px rgba(0,0,0,.6);filter:grayscale(.3) contrast(1.05);animation:abPop .6s var(--ease-out) .2s both;flex-shrink:0}
@keyframes abPop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.ab-quote{flex:1;min-width:200px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--border);position:relative;animation:abSlideIn .6s var(--ease-out) .35s both;overflow:hidden}
@keyframes abSlideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.ab-quote::before{content:"\201C";position:absolute;top:-8px;left:14px;font-size:42px;color:var(--primary);font-weight:700;font-family:Georgia,serif;line-height:1;opacity:.5}
.ab-quote-text-wrap{position:relative;min-height:48px;margin-bottom:10px;padding-left:14px;transition:min-height .6s cubic-bezier(.22,.61,.36,1)}
.ab-quote-text{font-size:13px;font-weight:500;color:var(--text);font-style:italic;line-height:1.6;position:absolute;top:0;left:14px;right:0;opacity:0;transform:translateY(10px) scale(.98);filter:blur(4px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1),filter .7s cubic-bezier(.22,.61,.36,1);pointer-events:none;will-change:opacity,transform,filter}
.ab-quote-text.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0);pointer-events:auto}
.ab-quote-text.leaving{opacity:0;transform:translateY(-10px) scale(.98);filter:blur(4px)}
.ab-quote-meta{display:flex;flex-wrap:wrap;gap:12px;padding-left:14px}
.ab-quote-meta span{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.3px;display:inline-flex;align-items:center;gap:5px}
.ab-quote-meta span i{color:var(--primary);font-size:10px}
.ab-headline{font-size:clamp(26px,7vw,38px);font-weight:800;line-height:1.08;letter-spacing:-1.2px;margin-bottom:16px;background:linear-gradient(135deg,#fff 0%,#a8b2d1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:abFadeUp .5s var(--ease-out) .5s both}
.ab-headline .accent{background:linear-gradient(120deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ab-desc{font-size:13.5px;line-height:1.75;color:var(--muted);margin-bottom:20px;max-width:600px;animation:abFadeUp .5s var(--ease-out) .6s both}
@keyframes abFadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.ab-currently{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);margin-bottom:32px;font-family:var(--font-mono);font-size:11.5px;animation:abFadeUp .5s var(--ease-out) .7s both}
.ab-currently .lbl{color:var(--muted-2);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.ab-currently .div{width:1px;height:14px;background:var(--border-strong)}
.ab-currently .val{color:var(--text);font-weight:600;transition:opacity .35s ease,transform .35s ease;display:inline-block}
.ab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px;padding:20px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ab-stat{text-align:center;animation:abPop .5s var(--ease-out) both}
.ab-stat:nth-child(1){animation-delay:.8s}
.ab-stat:nth-child(2){animation-delay:.9s}
.ab-stat:nth-child(3){animation-delay:1s}
.ab-stat-num{font-size:clamp(22px,6vw,32px);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,#a8b2d1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px}
.ab-stat-lbl{font-size:9.5px;font-weight:700;color:var(--muted-2);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font-mono)}
.ab-section{margin-bottom:32px;animation:abFadeUp .5s var(--ease-out) both}
.ab-sec-1{animation-delay:.9s}
.ab-sec-2{animation-delay:1s}
.ab-sec-3{animation-delay:1.1s}
.ab-section-title{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:16px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono)}
.ab-section-title::before{content:"";width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--secondary))}
.ab-toolkit{display:flex;flex-wrap:wrap;gap:8px}
.ab-tool{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:500;transition:transform .25s var(--ease-out),border-color .25s,box-shadow .25s;animation:abPop .4s var(--ease-out) both}
.ab-tool:nth-child(1){animation-delay:1.1s}
.ab-tool:nth-child(2){animation-delay:1.17s}
.ab-tool:nth-child(3){animation-delay:1.24s}
.ab-tool:nth-child(4){animation-delay:1.31s}
.ab-tool:nth-child(5){animation-delay:1.38s}
.ab-tool:nth-child(6){animation-delay:1.45s}
.ab-tool:nth-child(7){animation-delay:1.52s}
.ab-tool:nth-child(8){animation-delay:1.59s}
.ab-tool:hover{transform:translateY(-3px);border-color:var(--primary);color:var(--primary);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.ab-tool i{font-size:13px}
.ab-tool.t-js i{color:#f7df1e}
.ab-tool.t-react i{color:#61dafb}
.ab-tool.t-py i{color:#3776ab}
.ab-tool.t-node i{color:#339933}
.ab-tool.t-css i{color:#1572b6}
.ab-tool.t-linux i{color:#fcc624}
.ab-tool.t-git i{color:#f05032}
.ab-tool.t-ai i{color:#a855f7}
.ab-tool.t-ai{border-color:rgba(168,85,247,.3);background:linear-gradient(135deg,rgba(168,85,247,.08),transparent)}
.ab-reach{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ab-playlist{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:14px;transition:border-color .3s,transform .3s}
.ab-playlist:hover{border-color:var(--primary);transform:translateY(-2px)}
.ab-playlist-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1db954,#1ed760);display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0}
.ab-playlist-body h4{font-size:13px;font-weight:700;margin-bottom:2px}
.ab-playlist-body p{font-size:11px;color:var(--muted)}
</style>

<div class="ab-wrap">
  <div class="ab-header">
    <div class="ab-name">
      <span id="abName">-</span>
      <span class="sep">/</span>
      <span id="abUser">-</span>
    </div>
    <div class="ab-status">buka buat kolab</div>
  </div>

  <div class="ab-tabs">
    <button class="ab-tab active"><i class="fa-solid fa-user"></i> Siapa gw</button>
    <button class="ab-tab"><i class="fa-solid fa-code"></i> Tools</button>
    <button class="ab-tab"><i class="fa-solid fa-headphones"></i> Lagu</button>
  </div>

  <div class="ab-hero">
    <img class="ab-avatar" id="abAvatar" alt="Avatar" onerror="this.style.display='none'">
    <div class="ab-quote">
      <div class="ab-quote-text-wrap" id="abQuoteWrap"></div>
      <div class="ab-quote-meta">
        <span><i class="fa-solid fa-terminal"></i> suka ngulik</span>
        <span><i class="fa-solid fa-mug-hot"></i> ngopi dulu</span>
        <span><i class="fa-solid fa-headphones"></i> sambil dengerin lagu</span>
      </div>
    </div>
  </div>

  <h1 class="ab-headline" id="abHeadline"></h1>
  <p class="ab-desc" id="abDesc">-</p>

  <div class="ab-currently">
    <span class="lbl">currently</span>
    <span class="div"></span>
    <span class="val" id="abCurrent"></span>
  </div>

  <div class="ab-stats" id="abStats"></div>

  <div class="ab-section ab-sec-1">
    <div class="ab-section-title">tools yang sering dipake</div>
    <div class="ab-toolkit" id="abToolkit"></div>
  </div>

  <div class="ab-section ab-sec-2">
    <div class="ab-section-title">lagi diputer</div>
    <div class="ab-playlist">
      <div class="ab-playlist-icon"><i class="fa-brands fa-spotify"></i></div>
      <div class="ab-playlist-body">
        <h4>playlist ngoding malam</h4>
        <p>Lo-fi, chill beats, kadang synthwave — temen paling setia pas bugging wkwk</p>
      </div>
    </div>
  </div>

  <div class="ab-section ab-sec-3">
    <div class="ab-section-title">ngobrol yuk</div>
    <div class="ab-reach">
      <a class="btn btn-wa" id="abWa" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Chat WA</a>
      <a class="btn btn-ghost" id="abChannel" target="_blank" rel="noopener"><i class="fa-solid fa-bullhorn"></i> Ikutin Saluran</a>
    </div>
  </div>
</div>

<script>
(function(){
  const data = window.getCloudData(); if(!data) return;
  const d = data.preferences?.developer || {};
  const c = data.preferences?.contact || {};
  const $ = window.$;
  const esc = window.esc;

  const currentlyList = Array.isArray(d.currently)
    ? d.currently
    : (typeof d.currently === "string" && d.currently.includes("|"))
      ? d.currently.split("|").map(s => s.trim()).filter(Boolean)
      : [d.currently || "lagi ngulik sesuatu", "oprek code terus", "belajar dari error"];

  const quoteList = Array.isArray(d.quote)
    ? d.quote
    : (typeof d.quote === "string" && d.quote.includes("|"))
      ? d.quote.split("|").map(s => s.trim()).filter(Boolean)
      : [d.quote || "yang penting jalan dulu", "error itu guru paling jujur", "ngulik terus, paham pelan-pelan"];

  const setTxt = (id, v) => { const el = $(id); if(el) el.textContent = v || ""; };
  const setSrc = (id, v) => { const el = $(id); if(el) el.src = v || ""; };
  const setHref = (id, v) => { const el = $(id); if(el) el.href = v || "#"; };

  setTxt("#abName", d.name);
  setTxt("#abUser", d.username);
  setSrc("#abAvatar", d.profileImage);
  setTxt("#abDesc", d.description);

  const headline = $("#abHeadline");
  if(headline){
    headline.innerHTML = `ngulik code, <span class="accent">bikin sesuatu yang kepake</span>, sambil ngopi`;
  }

  const statsEl = $("#abStats");
  if(statsEl) statsEl.innerHTML = (d.stats||[]).map(s =>
    `<div class="ab-stat"><div class="ab-stat-num">${esc(s.num)}</div><div class="ab-stat-lbl">${esc(s.label)}</div></div>`
  ).join("");

  const tkEl = $("#abToolkit");
  if(tkEl) tkEl.innerHTML = (d.toolkit||[]).map(t =>
    `<div class="ab-tool ${esc(t.cls)}"><i class="${esc(t.icon)}"></i> ${esc(t.name)}</div>`
  ).join("");

  setHref("#abWa", c.whatsapp);
  setHref("#abChannel", c.channel);

  const quoteWrap = $("#abQuoteWrap");
  if(quoteWrap && quoteList.length){
    quoteWrap.innerHTML = quoteList.map((q, i) =>
      `<div class="ab-quote-text ${i===0?'active':''}">${esc(q)}</div>`
    ).join("");

    if(quoteList.length > 1){
      let idx = 0, prev = 0;
      setInterval(() => {
        const items = quoteWrap.querySelectorAll(".ab-quote-text");
        const cur = items[prev];
        if(cur){
          cur.classList.remove("active");
          cur.classList.add("leaving");
          setTimeout(() => cur.classList.remove("leaving"), 700);
        }
        idx = (idx + 1) % items.length;
        items[idx].classList.add("active");
        prev = idx;
      }, 4500);
    }
  }

  const currentEl = $("#abCurrent");
  if(currentEl && currentlyList.length){
    let idx = 0;
    currentEl.textContent = currentlyList[0];

    if(currentlyList.length > 1){
      setInterval(() => {
        currentEl.style.opacity = "0";
        currentEl.style.transform = "translateY(-4px)";
        setTimeout(() => {
          idx = (idx + 1) % currentlyList.length;
          currentEl.textContent = currentlyList[idx];
          currentEl.style.opacity = "1";
          currentEl.style.transform = "translateY(0)";
        }, 350);
      }, 3500);
    }
  }

  document.querySelectorAll(".ab-tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".ab-tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    };
  });
})();
</script>
