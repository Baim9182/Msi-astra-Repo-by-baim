<style>
.ad-container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
.ad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.ad-title { font-size: 18px; font-weight: 800; color: var(--primary); }
.ad-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.ad-tabs::-webkit-scrollbar { display: none; }
.ad-tabs button { flex-shrink: 0; padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: .2s; }
.ad-tabs button.active { background: var(--primary); color: #000; border-color: var(--primary); }
.ad-list-btn { width: 100%; margin-bottom: 16px; padding: 14px; font-size: 13px; }
.ad-item { padding: 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.ad-item-info b { font-size: 13.5px; display: block; margin-bottom: 4px; color: var(--text); }
.ad-item-info small { font-size: 11px; color: var(--muted); display: block; }
.ad-item-btns { display: flex; gap: 6px; flex-shrink: 0; }
.ad-item-btns button { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border); color: var(--primary); cursor: pointer; display: grid; place-items: center; font-size: 13px; }
.ad-item-btns button.del { color: #f87171; }
.ad-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.ad-field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.ad-field input, .ad-field textarea, .ad-field select { width: 100%; padding: 14px; border-radius: 12px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: .2s; }
.ad-field input:focus, .ad-field textarea:focus { border-color: var(--primary); }
.ad-form-actions { display: flex; gap: 10px; margin-top: 24px; }
.ad-dash { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.ad-stat { padding: 20px 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface-2); text-align: center; }
.ad-stat .num { font-size: 28px; font-weight: 800; font-family: var(--font-mono); color: var(--primary); line-height: 1; margin-bottom: 8px; }
.ad-stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.ad-banner { padding: 16px; border-radius: 14px; background: rgba(96,165,250,.1); border: 1px solid rgba(96,165,250,.2); color: #60a5fa; font-size: 12px; margin-bottom: 20px; text-align: center; line-height: 1.5; }
</style>

<div class="ad-container">
  <div class="ad-header">
    <div class="ad-title"><i class="fa-solid fa-sliders"></i> Manajemen Website</div>
    <button class="btn btn-ghost" onclick="window.clearSession(); window.closeAdminPanel();" style="padding: 8px 14px; font-size: 11px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>
  
  <div class="ad-tabs" id="adTabs"></div>
  <div id="adContent"></div>
</div>

<script>
(function(){
  const $ = window.$, esc = window.esc, getData = window.getCloudData, save = window.persistCloud, toast = window.toast;
  
  const TABS = { 
    dashboard: "📊 Dashboard", 
    services: "🛠 Jasa", 
    products: "📦 Produk", 
    tools: "🔧 Tools", 
    payment: "💳 Payment",
    sidebar: "📑 Sidebar",
    prefs: "⚙️ Pengaturan" 
  };
  let curTab = "dashboard", editing = null;

  function render() {
    const tabs = $("#adTabs");
    tabs.innerHTML = Object.entries(TABS).map(([k,v]) => `<button data-tab="${k}" class="${k===curTab?'active':''}">${v}</button>`).join("");
    tabs.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { curTab = b.dataset.tab; editing = null; render(); });
    
    if (editing) return renderForm();
    if (curTab === "dashboard") return renderDash();
    if (curTab === "prefs") return renderPrefs();
    renderList();
  }

  function renderDash() {
    const d = getData();
    const activeTools = (d.tools || []).filter(t => t.enabled !== false).length;
    $("#adContent").innerHTML = `
      <div class="ad-banner">
        <b>Selamat datang, Admin!</b><br>Semua perubahan di sini langsung tersimpan ke database Gist secara otomatis.
      </div>
      <div class="ad-dash">
        <div class="ad-stat"><div class="num">${(d.services||[]).length}</div><div class="lbl">Layanan Jasa</div></div>
        <div class="ad-stat"><div class="num">${(d.products||[]).length}</div><div class="lbl">Produk Digital</div></div>
        <div class="ad-stat"><div class="num">${activeTools}</div><div class="lbl">Tools Aktif</div></div>
        <div class="ad-stat"><div class="num">${(d.sidebar||[]).length}</div><div class="lbl">Menu Navigasi</div></div>
      </div>
      <p style="font-size:12px;color:var(--muted);text-align:center">Gunakan tab di atas untuk mulai mengedit.</p>
    `;
  }

  function renderList() {
    const list = getData()[curTab] || [];
    $("#adContent").innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add><i class="fa-solid fa-plus"></i> Tambah Data Baru</button>
      <div>
        ${list.map((it,i) => `
        <div class="ad-item">
          <div class="ad-item-info">
            <b>${esc(it.name||it.label||it.id)}</b>
            <small>${esc(it.price||it.cat||it.desc||it.value||"")}</small>
          </div>
          <div class="ad-item-btns">
            ${curTab === 'tools' ? `<button data-toggle="${i}" title="Aktif/Nonaktif"><i class="fa-solid ${it.enabled !== false ? 'fa-toggle-on' : 'fa-toggle-off'}"></i></button>` : ''}
            <button data-edit="${i}" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="del" data-del="${i}" title="Hapus"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`).join("") || '<div style="text-align:center;padding:30px;color:var(--muted);border:1px dashed var(--border);border-radius:12px">Belum ada data.</div>'}
      </div>`;
      
    $("#adContent").querySelector("[data-add]").onclick = () => { editing = { idx: -1 }; render(); };
    
    $("#adContent").querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
      const i = +b.dataset.toggle;
      getData().tools[i].enabled = getData().tools[i].enabled === false ? true : false;
      await save(); window.refreshAll(); render(); toast("Status diubah");
    });
    
    $("#adContent").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { idx: +b.dataset.edit }; render(); });
    
    $("#adContent").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      if(!confirm("Yakin ingin menghapus data ini?")) return;
      getData()[curTab].splice(+b.dataset.del, 1);
      await save(); window.refreshAll(); render(); toast("Data dihapus", "error");
    });
  }

  function renderForm() {
    const isNew = editing.idx === -1;
    const data = isNew ? {} : getData()[curTab][editing.idx];
    
    let fields = `
      <div class="ad-field"><label>Nama / Label</label><input id="fName" value="${esc(data.name||data.label||"")}" placeholder="Masukkan nama..."></div>
      <div class="ad-field"><label>Harga / Target Link / Kategori</label><input id="fPrice" value="${esc(data.price||data.target||data.cat||"")}" placeholder="..."></div>
      <div class="ad-field"><label>Deskripsi / Icon Class</label><textarea id="fDesc" rows="3" placeholder="...">${esc(data.description||data.desc||data.icon||"")}</textarea></div>
    `;

    if (curTab === "tools") {
      fields += `<div class="ad-field"><label>API URL Endpoint</label><input id="fApi" value="${esc(data.api||"")}" placeholder="https://..."></div>`;
    }

    $("#adContent").innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <button class="btn btn-ghost" onclick="document.querySelector('[data-tab=\\'${curTab}\\']').click()" style="padding:8px 12px"><i class="fa-solid fa-arrow-left"></i></button>
        <div style="font-size:16px;font-weight:700">${isNew?'Tambah':'Edit'} ${TABS[curTab]}</div>
      </div>
      ${fields}
      <div class="ad-form-actions">
        <button class="btn btn-ghost" id="fCancel" style="flex:1">Batal</button>
        <button class="btn btn-primary" id="fSave" style="flex:2">Simpan Perubahan</button>
      </div>`;
    
    $("#fCancel").onclick = () => { editing = null; render(); };
    $("#fSave").onclick = async () => {
      const obj = { ...data };
      obj.name = $("#fName").value;
      if(curTab==='sidebar') obj.label = $("#fName").value;
      
      if(curTab==='sidebar') obj.target = $("#fPrice").value; else obj.price = $("#fPrice").value;
      if(curTab==='tools') obj.cat = $("#fPrice").value;
      
      if(curTab==='sidebar') obj.desc = $("#fDesc").value; else obj.description = $("#fDesc").value;
      if(curTab==='tools') obj.desc = $("#fDesc").value;
      if(curTab==='tools') obj.api = $("#fApi").value;
      
      if (isNew) getData()[curTab].push(obj);
      else getData()[curTab][editing.idx] = obj;
      
      const btn = $("#fSave"); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
      const ok = await save();
      btn.disabled = false; btn.innerHTML = "Simpan Perubahan";
      if (ok) { toast("Berhasil disimpan!", "success"); editing = null; window.refreshAll(); render(); }
      else toast("Gagal menyimpan. Cek koneksi internet.", "error");
    };
  }

  function renderPrefs() {
    const p = getData().preferences;
    const t = getData().themes?.t1 || getData().themes;
    $("#adContent").innerHTML = `
      <div class="ad-field"><label>Nama Website (App Name)</label><input id="pName" value="${esc(p.appName)}"></div>
      <div class="ad-field"><label>Subteks Hero</label><input id="pSub" value="${esc(p.heroSubtitle)}"></div>
      <div class="ad-field"><label>Nomor WhatsApp (Link)</label><input id="pWa" value="${esc(p.contact?.whatsapp||"")}"></div>
      <div class="ad-field"><label>Warna Tema Utama (Hex)</label><input id="pTema" value="${esc(t?.primary||"#ffffff")}"></div>
      <button class="btn btn-primary btn-block" id="pSave" style="margin-top:20px">Simpan Pengaturan</button>`;
    
    $("#pSave").onclick = async () => {
      p.appName = $("#pName").value;
      p.heroSubtitle = $("#pSub").value;
      if(!p.contact) p.contact = {};
      p.contact.whatsapp = $("#pWa").value;
      if(getData().themes?.t1) getData().themes.t1.primary = $("#pTema").value;
      else if(getData().themes) getData().themes.primary = $("#pTema").value;
      
      const btn = $("#pSave"); btn.innerHTML = "Menyimpan..."; btn.disabled = true;
      const ok = await save();
      btn.innerHTML = "Simpan Pengaturan"; btn.disabled = false;
      if (ok) { toast("Pengaturan tersimpan", "success"); window.refreshAll(); }
      else toast("Gagal", "error");
    };
  }

  render();
})();
</script>
