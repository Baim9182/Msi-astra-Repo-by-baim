<style>
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-right:40px}
.ad-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ad-title i{color:var(--primary);font-size:15px}
.ad-logout{padding:6px 10px;font-size:10.5px}
.ad-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tabs button{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:var(--font-mono);transition:all .25s}
.ad-tabs button.active{background:var(--primary);color:#000;border-color:var(--primary)}
.ad-list-btn{width:100%;margin-bottom:12px}
.ad-list{max-height:340px;overflow-y:auto;padding-right:4px}
.ad-item{padding:12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ad-item-info{flex:1;min-width:0;overflow:hidden}
.ad-item-info b{font-size:12.5px;display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-item-info small{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.ad-item-btns{display:flex;gap:5px;flex-shrink:0}
.ad-item-btns button{width:32px;height:32px;border-radius:9px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--primary);font-size:11px;display:grid;place-items:center}
.ad-item-btns button.del{color:#f87171}
.ad-empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border-strong);border-radius:12px}
.ad-footer{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.ad-footer .btn{flex:1;font-size:11px;padding:9px}
.ad-banner{padding:12px 16px;border-radius:13px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fbbf24;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:var(--font-mono)}
.ad-label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono)}
.ad-mode{display:flex;gap:6px;margin-bottom:16px}
.ad-mode .btn{flex:1;font-size:11px;padding:10px 6px}
.ad-field{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.ad-field label{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-family:var(--font-mono)}
.ad-field input,.ad-field textarea,.ad-field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.ad-field textarea{resize:vertical;min-height:80px}
.ad-field input:focus,.ad-field textarea:focus,.ad-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ad-theme-card{padding:14px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:14px}
.ad-theme-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ad-theme-title{display:flex;align-items:center;gap:10px}
.ad-theme-color{width:32px;height:32px;border-radius:9px}
.ad-theme-title b{font-size:13px}
.ad-color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ad-form-actions{display:flex;gap:8px;margin-top:16px}
.ad-img-input{display:flex;gap:6px;align-items:stretch}
.ad-img-input input[type="text"]{flex:1;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
.ad-img-input input[type="text"]:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ad-img-btn{flex-shrink:0;padding:0 14px;border-radius:12px;background:var(--primary);color:#000;font-size:11.5px;font-weight:700;font-family:var(--font-mono);cursor:pointer;border:1px solid var(--primary);display:inline-flex;align-items:center;gap:6px;transition:all .25s}
.ad-img-btn:active{transform:scale(.95)}
.ad-img-preview{margin-top:8px;padding:8px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);text-align:center}
.ad-img-preview img{max-width:100%;max-height:160px;border-radius:8px;object-fit:cover}
.blk-card{padding:14px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:10px}
.blk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.blk-type{font-size:10.5px;font-weight:700;color:var(--primary);text-transform:uppercase;font-family:var(--font-mono);display:flex;align-items:center;gap:6px}
.blk-tools{display:flex;gap:4px}
.blk-tools button{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:11px;display:grid;place-items:center;cursor:pointer}
.blk-tools button.del{color:#f87171}
.blk-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.blk-picker button{padding:14px 8px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .25s}
.blk-picker button:active{transform:scale(.95);border-color:var(--primary)}
.blk-picker button i{font-size:18px;color:var(--primary)}
.pv-wrap{background:#000;border-radius:12px;border:1px solid var(--border);padding:16px;margin-top:12px;max-height:60vh;overflow-y:auto}
.ver-item{padding:12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ver-item small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
</style>

<button class="modal-close" data-ad-act="close"><i class="fa-solid fa-xmark"></i></button>

<div class="ad-head">
  <div class="ad-title"><i class="fa-solid fa-sliders"></i> Admin Tools</div>
  <button class="btn btn-ghost ad-logout" data-ad-act="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</div>

<div class="ad-tabs" id="adTabs"></div>
<div id="adContent"></div>

<div class="ad-footer">
  <button class="btn btn-ghost" data-ad-act="sync"><i class="fa-solid fa-rotate"></i> Sync</button>
  <button class="btn btn-ghost" data-ad-act="export"><i class="fa-solid fa-download"></i> Export</button>
</div>

<script>
(function () {
  const $ = window.$;
  const esc = window.esc;
  const toast = window.toast;
  const getCloudData = window.getCloudData;
  const setCloudData = window.setCloudData;
  const persistCloud = window.persistCloud;
  const cloudLoad = window.cloudLoad;
  const cloudVersions = window.cloudVersions;
  const cloudRestore = window.cloudRestore;
  const ensureStructure = window.ensureStructure;
  const closeAdminPanel = window.closeAdminPanel;
  const renderBlock = window.renderBlock;

  const TABS = {
    services: "Jasa", products: "Produk", payment: "Payment", projects: "Project",
    themes: "Tema", sidebar: "Sidebar", navbar: "Navbar", pages: "Pages",
    builder: "Builder", prefs: "Preferensi", website: "Website", history: "History"
  };

  const FIELDS = {
    services: [
      { k: "name", l: "Nama Jasa", t: "text" },
      { k: "description", l: "Deskripsi", t: "textarea" },
      { k: "image", l: "Gambar Jasa", t: "text" },
      { k: "price", l: "Harga", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["Tersedia", "Tidak Tersedia", "Pre-Order", "Coming Soon"] },
      { k: "icon", l: "Icon (fa-xxx)", t: "text" }
    ],
    products: [
      { k: "name", l: "Nama Produk", t: "text" },
      { k: "description", l: "Deskripsi", t: "textarea" },
      { k: "image", l: "Gambar Produk", t: "text" },
      { k: "price", l: "Harga", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["Tersedia", "Tidak Tersedia", "Pre-Order", "Coming Soon"] },
      { k: "icon", l: "Icon (fa-xxx)", t: "text" }
    ],
    payment: [
      { k: "id", l: "ID", t: "text" },
      { k: "name", l: "Nama", t: "text" },
      { k: "icon", l: "Icon", t: "text" },
      { k: "color", l: "Warna (hex)", t: "text" },
      { k: "type", l: "Tipe", t: "select", o: ["qris", "phone", "url"] },
      { k: "value", l: "Value / QRIS Image", t: "image-or-text" },
      { k: "status", l: "Status", t: "select", o: ["available", "unavailable", "maintenance"] }
    ],
    projects: [
      { k: "name", l: "Nama Project", t: "text" },
      { k: "description", l: "Deskripsi", t: "textarea" },
      { k: "icon", l: "Icon (fa-xxx)", t: "text" },
      { k: "image", l: "Screenshot", t: "text" },
      { k: "tech", l: "Tech Stack", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["live", "beta", "coming-soon", "development", "archived"] },
      { k: "type", l: "Tipe", t: "select", o: ["web", "app", "other"] },
      { k: "url", l: "Link", t: "text" }
    ],
    sidebar: [
      { k: "id", l: "ID", t: "text" },
      { k: "label", l: "Label", t: "text" },
      { k: "desc", l: "Deskripsi", t: "text" },
      { k: "icon", l: "Icon (fa-xxx)", t: "text" },
      { k: "color", l: "Warna", t: "select", o: ["", "orange", "green", "purple"] },
      { k: "adminOnly", l: "Admin Only", t: "select", o: ["false", "true"] },
      { k: "type", l: "Tipe", t: "select", o: ["page", "builtin"] },
      { k: "target", l: "Target", t: "text" }
    ],
    navbar: [
      { k: "id", l: "ID", t: "text" },
      { k: "label", l: "Label", t: "text" },
      { k: "icon", l: "Icon (fa-xxx)", t: "text" },
      { k: "page", l: "Target Page", t: "text" }
    ]
  };

  const BLOCK_TYPES = [
    { type: "heading", label: "Heading", icon: "fa-heading", fields: [
      { k: "text", l: "Teks", t: "text" }, { k: "size", l: "Ukuran", t: "select", o: ["sm", "md", "lg", "xl"] }, { k: "align", l: "Align", t: "select", o: ["left", "center", "right"] }
    ]},
    { type: "text", label: "Teks", icon: "fa-paragraph", fields: [
      { k: "text", l: "Teks", t: "textarea" }, { k: "align", l: "Align", t: "select", o: ["left", "center", "right"] }
    ]},
    { type: "image", label: "Gambar", icon: "fa-image", fields: [
      { k: "src", l: "URL / Upload", t: "text" }, { k: "alt", l: "Alt", t: "text" }, { k: "rounded", l: "Rounded", t: "select", o: ["true", "false"] }, { k: "width", l: "Width", t: "text" }, { k: "align", l: "Align", t: "select", o: ["left", "center", "right"] }
    ]},
    { type: "button", label: "Tombol", icon: "fa-hand-pointer", fields: [
      { k: "label", l: "Label", t: "text" }, { k: "href", l: "Link", t: "text" }, { k: "icon", l: "Icon", t: "text" }, { k: "style", l: "Style", t: "select", o: ["primary", "ghost", "wa"] }, { k: "align", l: "Align", t: "select", o: ["left", "center", "right"] }
    ]},
    { type: "hero", label: "Hero", icon: "fa-star", fields: [
      { k: "badge", l: "Badge", t: "text" }, { k: "title", l: "Judul", t: "text" }, { k: "subtitle", l: "Subjudul", t: "text" }
    ]},
    { type: "card-grid", label: "Card Grid", icon: "fa-table-cells", fields: [] },
    { type: "table", label: "Tabel", icon: "fa-table", fields: [] },
    { type: "form", label: "Form", icon: "fa-list", fields: [] },
    { type: "announcement", label: "Pengumuman", icon: "fa-bullhorn", fields: [
      { k: "text", l: "Teks", t: "textarea" }, { k: "type", l: "Tipe", t: "select", o: ["info", "success", "warning", "error"] }
    ]},
    { type: "list", label: "List", icon: "fa-list-ul", fields: [] },
    { type: "quote", label: "Quote", icon: "fa-quote-left", fields: [
      { k: "text", l: "Teks", t: "textarea" }, { k: "author", l: "Author", t: "text" }
    ]},
    { type: "code", label: "Code", icon: "fa-code", fields: [{ k: "text", l: "Code", t: "textarea" }] },
    { type: "divider", label: "Divider", icon: "fa-minus", fields: [{ k: "style", l: "Style", t: "select", o: ["line", "dashed"] }] },
    { type: "spacer", label: "Spacer", icon: "fa-arrows-up-down", fields: [{ k: "height", l: "Tinggi", t: "text" }] }
  ];

  let currentTab = "services";
  let editing = null;
  let builderSub = "pages";
  let editingPageId = null;
  let previewPage = null;

  try { const s = sessionStorage.getItem("msi_admin_tab"); if (s && TABS[s]) currentTab = s; } catch (e) { }
  function saveTabState() { try { sessionStorage.setItem("msi_admin_tab", currentTab); } catch (e) { } }

  const saveBtn = async (btn, label) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const ok = await persistCloud();
    btn.disabled = false;
    btn.innerHTML = label;
    if (ok) { toast("Tersimpan.", "success"); render(); }
    else toast("Gagal simpan.", "error");
    return ok;
  };

  function render() {
    const content = $("#adContent"); if (!content) return;
    const tabsEl = $("#adTabs");
    tabsEl.innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === currentTab ? 'active' : ''}">${v}</button>`).join("");
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      currentTab = b.dataset.tab; editing = null; editingPageId = null; previewPage = null; saveTabState(); render();
    });

    if (editingPageId) return renderPageEditor(content);
    if (previewPage) return renderPreview(content);
    if (editing) return renderForm(content);
    if (currentTab === "themes") return renderThemes(content);
    if (currentTab === "pages") return renderPages(content);
    if (currentTab === "builder") return renderBuilder(content);
    if (currentTab === "prefs") return renderPrefs(content);
    if (currentTab === "website") return renderWebsite(content);
    if (currentTab === "history") return renderHistory(content);
    renderList(content);
  }

  function renderList(content) {
    const data = getCloudData();
    const list = data[currentTab] || [];
    content.innerHTML = `<button class="btn btn-primary ad-list-btn" data-add><i class="fa-solid fa-plus"></i> Tambah ${TABS[currentTab]}</button><div class="ad-list">${list.length ? list.map((it, i) => `<div class="ad-item"><div class="ad-item-info"><b>${esc(it.name || it.label || it.id || "-")}</b><small>${esc(it.status || it.price || it.value || it.desc || it.tech || "")}</small></div><div class="ad-item-btns"><button data-edit="${i}"><i class="fa-solid fa-pen"></i></button><button class="del" data-del="${i}"><i class="fa-solid fa-trash"></i></button></div></div>`).join("") : '<div class="ad-empty">Belum ada data</div>'}</div>`;
    content.querySelector("[data-add]").onclick = () => { editing = { idx: -1 }; render(); };
    content.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { idx: Number(b.dataset.edit) }; render(); });
    content.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const i = Number(b.dataset.del);
      const it = getCloudData()[currentTab][i];
      const name = it?.name || it?.label || it?.id || "item";
      if (!confirm(`Hapus "${name}"?`)) return;
      getCloudData()[currentTab].splice(i, 1);
      await persistCloud(); refreshMain(); render(); toast("Dihapus.", "success");
    });
  }

  function renderForm(content) {
    const data = getCloudData();
    const fields = FIELDS[currentTab] || [];
    const isNew = editing.idx < 0;
    const item = isNew ? {} : (data[currentTab][editing.idx] || {});
    const isImg = (k) => ["image", "bimg", "avatar", "screenshot"].includes((k || "").toLowerCase());

    content.innerHTML = `<div class="ad-label">${isNew ? "Tambah" : "Edit"} ${TABS[currentTab]}</div>${fields.map(f => {
      const v = item[f.k] ?? "";
      if (f.t === "image-or-text") {
        const has = v && (String(v).startsWith("http") || String(v).startsWith("data:"));
        return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-f="${f.k}" rows="3" placeholder="Paste URL, teks, atau upload...">${esc(v)}</textarea><button type="button" class="ad-img-btn" data-imgt-upload="${f.k}" style="margin-top:8px;justify-content:center;width:100%"><i class="fa-solid fa-image"></i> Upload dari Galeri</button><input type="file" accept="image/*" data-imgt-file="${f.k}" style="display:none"><div class="ad-img-preview" data-imgt-preview="${f.k}" style="display:${has ? 'block' : 'none'};margin-top:8px"><img src="${has ? esc(v) : ''}" onerror="this.parentElement.style.display='none'"></div></div>`;
      }
      if (isImg(f.k) && f.t !== "textarea") {
        return `<div class="ad-field"><label>${esc(f.l)}</label><div class="ad-img-input"><input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="URL / upload..."><button type="button" class="ad-img-btn" data-upload="${f.k}"><i class="fa-solid fa-image"></i> Galeri</button></div><input type="file" accept="image/*" data-file="${f.k}" style="display:none"><div class="ad-img-preview" data-preview="${f.k}" style="display:${v ? 'block' : 'none'}"><img src="${esc(v)}" onerror="this.parentElement.style.display='none'"></div></div>`;
      }
      if (f.t === "textarea") return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-f="${f.k}" rows="3">${esc(v)}</textarea></div>`;
      if (f.t === "select") return `<div class="ad-field"><label>${esc(f.l)}</label><select data-f="${f.k}">${f.o.map(o => `<option value="${esc(o)}" ${String(o) == String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
      return `<div class="ad-field"><label>${esc(f.l)}</label><input type="text" data-f="${f.k}" value="${esc(v)}"></div>`;
    }).join("")}<div class="ad-form-actions"><button class="btn btn-ghost" data-cancel style="flex:1">Batal</button><button class="btn btn-primary" data-save style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div>`;

    content.querySelectorAll("[data-imgt-upload]").forEach(btn => btn.onclick = () => content.querySelector(`[data-imgt-file="${btn.dataset.imgtUpload}"]`)?.click());
    content.querySelectorAll("[data-imgt-file]").forEach(inp => inp.onchange = e => {
      const f = e.target.files?.[0]; if (!f) return;
      if (f.size > 2 * 1024 * 1024) { toast("Max 2MB.", "error"); return; }
      const rd = new FileReader();
      rd.onload = ev => {
        const b64 = ev.target.result;
        content.querySelector(`[data-f="${inp.dataset.imgtFile}"]`).value = b64;
        const p = content.querySelector(`[data-imgt-preview="${inp.dataset.imgtFile}"]`);
        if (p) { p.style.display = "block"; p.querySelector("img").src = b64; }
        toast("Ke-load.", "success");
      };
      rd.readAsDataURL(f);
    });
    fields.filter(f => f.t === "image-or-text").forEach(f => {
      const ta = content.querySelector(`textarea[data-f="${f.k}"]`); if (!ta) return;
      ta.oninput = () => {
        const v = ta.value.trim();
        const p = content.querySelector(`[data-imgt-preview="${f.k}"]`);
        if (!p) return;
        if (v && (v.startsWith("http") || v.startsWith("data:"))) { p.style.display = "block"; p.querySelector("img").src = v; }
        else p.style.display = "none";
      };
    });
    content.querySelectorAll("[data-upload]").forEach(btn => btn.onclick = () => content.querySelector(`[data-file="${btn.dataset.upload}"]`)?.click());
    content.querySelectorAll("[data-file]").forEach(inp => inp.onchange = e => {
      const f = e.target.files?.[0]; if (!f) return;
      if (f.size > 2 * 1024 * 1024) { toast("Max 2MB.", "error"); return; }
      const rd = new FileReader();
      rd.onload = ev => {
        const b64 = ev.target.result;
        content.querySelector(`[data-f="${inp.dataset.file}"]`).value = b64;
        const p = content.querySelector(`[data-preview="${inp.dataset.file}"]`);
        if (p) { p.style.display = "block"; p.querySelector("img").src = b64; }
        toast("Ke-load.", "success");
      };
      rd.readAsDataURL(f);
    });
    content.querySelector("[data-cancel]").onclick = () => { editing = null; render(); };
    content.querySelector("[data-save]").onclick = async (e) => {
      const obj = {};
      fields.forEach(f => {
        const el = content.querySelector(`[data-f="${f.k}"]`);
        let val = el ? el.value.trim() : "";
        if (f.k === "adminOnly") val = val === "true";
        obj[f.k] = val;
      });
      if (!obj.name && !obj.label && !obj.id) { toast("Field wajib.", "error"); return; }
      if (isNew) getCloudData()[currentTab].push(obj);
      else getCloudData()[currentTab][editing.idx] = obj;
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok) { editing = null; refreshMain(); }
    };
  }

  function renderThemes(content) {
    const t = getCloudData().themes?.t1 || {};
    content.innerHTML = `<div class="ad-banner" style="background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#60a5fa"><i class="fa-solid fa-circle-info"></i> Tema cuma <b style="margin-left:4px">Monochrome</b></div>${themeCard("t1", t)}`;
    content.querySelector(`[data-th-save="t1"]`).onclick = async (e) => {
      const th = getCloudData().themes.t1;
      const g = (s) => content.querySelector(`[data-th="t1-${s}"]`).value.trim();

      th.secondary = g("secondary") || th.secondary;

  function themeCard(k, t) {
    return `<div class="ad-theme-card"><div class="ad-theme-head"><div class="ad-theme-title"><div class="ad-theme-color" style="background:linear-gradient(135deg,${t.primary},${t.secondary})"></div><b>${esc(t.name)}</b></div></div><div class="ad-field"><label>Nama</label><input data-th="${k}-name" value="${esc(t.name)}"></div><div class="ad-color-grid"><div class="ad-field"><label>Primary</label><input data-th="${k}-primary" value="${esc(t.primary)}"></div><div class="ad-field"><label>Secondary</label><input data-th="${k}-secondary" value="${esc(t.secondary)}"></div></div><div class="ad-field"><label>Background</label><div class="ad-img-input"><input type="text" data-th="${k}-bg" value="${esc(t.bgImage || "")}"><button type="button" class="ad-img-btn" data-th-upload="${k}"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-th-file="${k}" style="display:none"><div class="ad-img-preview" data-th-preview="${k}" style="display:${t.bgImage ? 'block' : 'none'};margin-top:8px"><img src="${esc(t.bgImage || "")}" onerror="this.parentElement.style.display='none'"></div></div><div class="ad-field"><label>Opacity</label><input type="number" step="0.05" min="0" max="1" data-th="${k}-opacity" value="${t.bgOpacity || 0.15}"></div><div class="ad-label" style="margin-top:10px">Banner</div><div class="ad-field"><label>Judul</label><input data-th="${k}-btitle" value="${esc(t.banner?.title || "")}"></div><div class="ad-field"><label>Deskripsi</label><input data-th="${k}-bdesc" value="${esc(t.banner?.desc || "")}"></div><div class="ad-field"><label>URL Banner</label><div class="ad-img-input"><input type="text" data-th="${k}-bimg" value="${esc(t.banner?.image || "")}"><button type="button" class="ad-img-btn" data-th-upload-banner="${k}"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-th-file-banner="${k}" style="display:none"><div class="ad-img-preview" data-th-preview-banner="${k}" style="display:${t.banner?.image ? 'block' : 'none'};margin-top:8px"><img src="${esc(t.banner?.image || "")}" onerror="this.parentElement.style.display='none'"></div></div><button class="btn btn-primary btn-block" data-th-save="${k}"><i class="fa-solid fa-floppy-disk"></i> Simpan Tema</button></div>`;
  }

  function bindThemeUpload(content, k) {
    const bind = (btnSel, fileSel, targetSel, prevSel) => {
      const btn = content.querySelector(btnSel), file = content.querySelector(fileSel);
      if (!btn || !file) return;
      btn.onclick = () => file.click();
      file.onchange = e => {
        const f = e.target.files?.[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) { toast("Max 2MB.", "error"); return; }
        const rd = new FileReader();
        rd.onload = ev => {
          content.querySelector(targetSel).value = ev.target.result;
          const p = content.querySelector(prevSel);
          if (p) { p.style.display = "block"; p.querySelector("img").src = ev.target.result; }
          toast("Ke-load.", "success");
        };
        rd.readAsDataURL(f);
      };
    };
    bind(`[data-th-upload="${k}"]`, `[data-th-file="${k}"]`, `[data-th="${k}-bg"]`, `[data-th-preview="${k}"]`);
    bind(`[data-th-upload-banner="${k}"]`, `[data-th-file-banner="${k}"]`, `[data-th="${k}-bimg"]`, `[data-th-preview-banner="${k}"]`);
  }

    body.querySelector("[data-add-bp]").onclick = () => {

      const m = getCloudData().builder.modules[id];
      m.enabled = m.enabled === false ? true : false;

  function openModuleEditor(body, editId) {

    body.querySelector("#modCancel").onclick = () => render();
    body.querySelector("#modSave").onclick = async (e) => {
      const name = body.querySelector("#modName").value.trim();
      if (!name) { toast("Nama wajib.", "error"); return; }
      const id = editId || "mod_" + name.toLowerCase().replace(/[^a-z0-9]/g, "_") + "_" + Math.random().toString(36).slice(2, 5);
      getCloudData().builder.modules[id] = { id, name, desc: body.querySelector("#modDesc").value.trim(), icon: body.querySelector("#modIcon").value.trim() || "fa-puzzle-piece", color: body.querySelector("#modColor").value, enabled: ex.enabled !== false, pageIds: body.querySelector("#modPages").value.split(",").map(x => x.trim()).filter(Boolean) };
      const btn = e.target.closest("button"); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      const ok = await persistCloud(); btn.disabled = false; btn.innerHTML = "Simpan";
      if (ok) { toast("Tersimpan.", "success"); refreshMain(); render(); } else toast("Gagal.", "error");

  function renderPageEditor(content) {
    const p = getCloudData().builder.pages[editingPageId];
    if (!p) { editingPageId = null; render(); return; }
    content.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn btn-ghost" data-back style="padding:8px 12px"><i class="fa-solid fa-arrow-left"></i></button><div style="flex:1"><div class="ad-label" style="margin:0">Edit: ${esc(p.title)}</div></div><span class="badge ${p.status === "published" ? "available" : "maintenance"}" style="font-size:9px">${esc(p.status)}</span></div><div class="ad-theme-card"><div class="ad-field"><label>Judul</label><input id="bpTitle" value="${esc(p.title)}"></div><div class="ad-field"><label>Subjudul</label><input id="bpSubtitle" value="${esc(p.subtitle || "")}"></div><div class="ad-color-grid"><div class="ad-field"><label>Status</label><select id="bpStatus"><option value="draft" ${p.status === "draft" ? "selected" : ""}>Draft</option><option value="published" ${p.status === "published" ? "selected" : ""}>Published</option></select></div><div class="ad-field"><label>Visible</label><select id="bpVisible"><option value="true" ${p.visible !== false ? "selected" : ""}>Ya</option><option value="false" ${p.visible === false ? "selected" : ""}>Sembunyikan</option></select></div></div><div class="ad-color-grid"><div class="ad-field"><label>Admin Only</label><select id="bpAdminOnly"><option value="false" ${p.adminOnly !== true ? "selected" : ""}>Tidak</option><option value="true" ${p.adminOnly === true ? "selected" : ""}>Ya</option></select></div><div class="ad-field"><label>SEO Title</label><input id="bpSeoTitle" value="${esc(p.seo?.title || "")}"></div></div><div class="ad-field"><label>SEO Desc</label><input id="bpSeoDesc" value="${esc(p.seo?.desc || "")}"></div></div><div class="ad-label" style="margin-top:14px">Blocks (${(p.blocks || []).length})</div><div id="blocksList"></div><button class="btn btn-primary btn-block" id="addBlock" style="margin-top:10px"><i class="fa-solid fa-plus"></i> Tambah Block</button><div class="ad-form-actions"><button class="btn btn-ghost" id="prevPage" style="flex:1"><i class="fa-solid fa-eye"></i> Preview</button><button class="btn btn-primary" id="savePage" style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div>`;

    const saveMeta = () => {
      p.title = content.querySelector("#bpTitle").value.trim() || p.id;
      p.subtitle = content.querySelector("#bpSubtitle").value.trim();
      p.status = content.querySelector("#bpStatus").value;
      p.visible = content.querySelector("#bpVisible").value === "true";
      p.adminOnly = content.querySelector("#bpAdminOnly").value === "true";
      p.seo = { title: content.querySelector("#bpSeoTitle").value.trim(), desc: content.querySelector("#bpSeoDesc").value.trim() };
      p.updatedAt = new Date().toISOString();
    };
    ["#bpTitle", "#bpSubtitle", "#bpStatus", "#bpVisible", "#bpAdminOnly", "#bpSeoTitle", "#bpSeoDesc"].forEach(sel => content.querySelector(sel)?.addEventListener("change", saveMeta));

    renderBlocks(content, p);
    content.querySelector("[data-back]").onclick = () => { editingPageId = null; render(); };
    content.querySelector("#addBlock").onclick = () => openBlockPicker(content, p);
    content.querySelector("#prevPage").onclick = () => { saveMeta(); previewPage = p.id; editingPageId = null; render(); };
    content.querySelector("#savePage").onclick = async (e) => {
      saveMeta();
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok) refreshMain();
    };
  }

  function renderBlocks(content, page) {
    const wrap = content.querySelector("#blocksList");
    if (!page.blocks?.length) { wrap.innerHTML = '<div class="ad-empty">Belum ada block.</div>'; return; }
    wrap.innerHTML = page.blocks.map((b, i) => {
      const t = BLOCK_TYPES.find(x => x.type === b.type) || { label: b.type, icon: "fa-cube", fields: [] };
      return `<div class="blk-card"><div class="blk-head"><div class="blk-type"><i class="fa-solid ${t.icon}"></i> ${esc(t.label)}</div><div class="blk-tools"><button data-up="${i}" ${i === 0 ? "disabled style=opacity:.3" : ""}><i class="fa-solid fa-chevron-up"></i></button><button data-down="${i}" ${i === page.blocks.length - 1 ? "disabled style=opacity:.3" : ""}><i class="fa-solid fa-chevron-down"></i></button><button class="del" data-del="${i}"><i class="fa-solid fa-trash"></i></button></div></div><div data-block-fields="${i}"></div></div>`;
    }).join("");

    page.blocks.forEach((b, i) => {
      const t = BLOCK_TYPES.find(x => x.type === b.type);
      const el = wrap.querySelector(`[data-block-fields="${i}"]`);
      if (!t || !el) return;
      b.data = b.data || {};
      if (!t.fields.length) { el.innerHTML = `<p style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">Block ini belum ada field.</p>`; return; }
      el.innerHTML = t.fields.map(f => {
        const v = b.data[f.k] ?? "";
        if (f.t === "textarea") return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-bf="${i}-${f.k}" rows="3">${esc(v)}</textarea></div>`;
        if (f.t === "select") return `<div class="ad-field"><label>${esc(f.l)}</label><select data-bf="${i}-${f.k}">${f.o.map(o => `<option value="${esc(o)}" ${String(o) == String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
        return `<div class="ad-field"><label>${esc(f.l)}</label><input data-bf="${i}-${f.k}" value="${esc(v)}"></div>`;
      }).join("");
      t.fields.forEach(f => {
        const inp = el.querySelector(`[data-bf="${i}-${f.k}"]`);
        if (inp) inp.oninput = () => { b.data[f.k] = inp.value; };
      });
    });

    wrap.querySelectorAll("[data-up]").forEach(btn => btn.onclick = () => { const i = Number(btn.dataset.up); [page.blocks[i - 1], page.blocks[i]] = [page.blocks[i], page.blocks[i - 1]]; renderBlocks(content, page); });
    wrap.querySelectorAll("[data-down]").forEach(btn => btn.onclick = () => { const i = Number(btn.dataset.down); [page.blocks[i + 1], page.blocks[i]] = [page.blocks[i], page.blocks[i + 1]]; renderBlocks(content, page); });
    wrap.querySelectorAll("[data-del]").forEach(btn => btn.onclick = () => { if (!confirm("Hapus block?")) return; page.blocks.splice(Number(btn.dataset.del), 1); renderBlocks(content, page); });
  }

  function openBlockPicker(content, page) {
    content.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><button class="btn btn-ghost" id="pickerBack" style="padding:8px 12px"><i class="fa-solid fa-arrow-left"></i></button><div class="ad-label" style="margin:0">Pilih Block</div></div><div class="blk-picker">${BLOCK_TYPES.map(t => `<button data-pick="${t.type}"><i class="fa-solid ${t.icon}"></i>${esc(t.label)}</button>`).join("")}</div>`;
    content.querySelector("#pickerBack").onclick = () => render();
    content.querySelectorAll("[data-pick]").forEach(btn => btn.onclick = () => {
      const type = btn.dataset.pick;
      const nb = { id: "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4), type, data: {} };
      if (type === "heading") nb.data = { text: "Judul Baru", size: "lg", align: "left" };
      if (type === "text") nb.data = { text: "Teks...", align: "left" };
      if (type === "button") nb.data = { label: "Klik", href: "#", icon: "fa-solid fa-arrow-right", style: "primary", align: "left" };
      if (type === "card-grid") nb.data = { cards: [{ title: "Card", desc: "Deskripsi", icon: "fa-solid fa-box" }] };
      if (type === "table") nb.data = { headers: ["A", "B"], rows: [["1", "2"]] };
      if (type === "form") nb.data = { fields: [{ label: "Nama", name: "nama", type: "text" }], submitLabel: "Kirim", submitTo: "whatsapp" };
      if (type === "list") nb.data = { items: ["Item 1", "Item 2"], ordered: false };
      if (type === "divider") nb.data = { style: "line" };
      if (type === "spacer") nb.data = { height: 24 };
      page.blocks = page.blocks || [];
      page.blocks.push(nb);
      editingPageId = page.id;
      render();
    });
  }

  function renderPreview(content) {
    const p = getCloudData().builder.pages[previewPage];
    if (!p) { previewPage = null; render(); return; }
    content.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn btn-ghost" id="prevBack" style="padding:8px 12px"><i class="fa-solid fa-arrow-left"></i></button><div class="ad-label" style="margin:0">Preview: ${esc(p.title)}</div></div><div class="pv-wrap" id="pvBody"></div><p style="font-size:10.5px;color:var(--muted-2);margin-top:10px;font-family:var(--font-mono);text-align:center">Preview hanya di admin.</p>`;
    content.querySelector("#pvBody").innerHTML = (p.blocks || []).map(renderBlock).join("") || "<p style='color:var(--muted);text-align:center'>Kosong</p>";
    content.querySelector("#prevBack").onclick = () => { previewPage = null; editingPageId = p.id; render(); };

  function renderPrefs(content) {
    const p = getCloudData().preferences;
    const d = p.developer;
    content.innerHTML = `<div class="ad-field"><label>App Name</label><input data-p="appName" value="${esc(p.appName)}"></div><div class="ad-field"><label>App Subtitle</label><input data-p="appSubtitle" value="${esc(p.appSubtitle)}"></div><div class="ad-field"><label>Logo</label><div class="ad-img-input"><input type="text" data-p="logo" value="${esc(p.logo || "")}"><button type="button" class="ad-img-btn" data-p-upload="logo"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-p-file="logo" style="display:none"><div class="ad-img-preview" data-p-preview="logo" style="display:${p.logo ? 'block' : 'none'};margin-top:8px"><img src="${esc(p.logo || "")}" onerror="this.parentElement.style.display='none'"></div></div><div class="ad-field"><label>Hero Badge</label><input data-p="heroBadge" value="${esc(p.heroBadge)}"></div><div class="ad-field"><label>Hero Subtitle</label><input data-p="heroSubtitle" value="${esc(p.heroSubtitle)}"></div><div class="ad-field"><label>Hero Rotate (|)</label><textarea data-p="heroRotate" rows="3">${esc((p.heroRotate || []).join(" | "))}</textarea></div><div class="ad-field"><label>Dev Name</label><input data-p="devName" value="${esc(d.name)}"></div><div class="ad-field"><label>Username</label><input data-p="devUser" value="${esc(d.username)}"></div><div class="ad-field"><label>Role</label><input data-p="devRole" value="${esc(d.role)}"></div><div class="ad-field"><label>Avatar</label><div class="ad-img-input"><input type="text" data-p="devProfile" value="${esc(d.profileImage)}"><button type="button" class="ad-img-btn" data-p-upload="devProfile"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-p-file="devProfile" style="display:none"></div><div class="ad-field"><label>Description</label><textarea data-p="devDesc" rows="3">${esc(d.description)}</textarea></div><div class="ad-field"><label>WhatsApp</label><input data-p="wa" value="${esc(p.contact.whatsapp)}"></div><div class="ad-field"><label>Channel</label><input data-p="channel" value="${esc(p.contact.channel)}"></div><div class="ad-field"><label>Daily Limit</label><input type="number" data-p="dailyLimit" value="${p.dailyLimit || 5}"></div><div class="ad-field"><label>Webhook</label><input data-p="webhook" value="${esc(p.webhookSaran || "")}"></div><button class="btn btn-primary btn-block" data-save-prefs><i class="fa-solid fa-floppy-disk"></i> Simpan</button>`;

    const bindImg = (field) => {
      const btn = content.querySelector(`[data-p-upload='${field}']`);
      const file = content.querySelector(`[data-p-file='${field}']`);
      if (!btn || !file) return;
      btn.onclick = () => file.click();
      file.onchange = e => {
        const f = e.target.files?.[0]; if (!f) return;
        if (f.size > 2 * 1024 * 1024) { toast("Max 2MB.", "error"); return; }
        const rd = new FileReader();
        rd.onload = ev => {
          content.querySelector(`[data-p='${field}']`).value = ev.target.result;
          const prev = content.querySelector(`[data-p-preview='${field}']`);
          if (prev) { prev.style.display = "block"; prev.querySelector("img").src = ev.target.result; }
          toast("Ke-load.", "success");
        };
        rd.readAsDataURL(f);
      };
    };
    bindImg("logo"); bindImg("devProfile");

    content.querySelector("[data-save-prefs]").onclick = async (e) => {
      const g = (k) => content.querySelector(`[data-p="${k}"]`).value.trim();
      p.appName = g("appName") || p.appName;
      p.appSubtitle = g("appSubtitle");
      p.logo = g("logo");
      p.heroBadge = g("heroBadge");
      p.heroSubtitle = g("heroSubtitle");
      p.heroRotate = g("heroRotate").split("|").map(x => x.trim()).filter(Boolean);
      d.name = g("devName"); d.username = g("devUser"); d.role = g("devRole");
      d.profileImage = g("devProfile"); d.description = g("devDesc");
      p.contact.whatsapp = g("wa"); p.contact.channel = g("channel");
      p.dailyLimit = parseInt(g("dailyLimit")) || 5;
      p.webhookSaran = g("webhook");
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok) { if (window.renderPreferences) window.renderPreferences(); if (window.applyLogo) window.applyLogo(); }
    };
  }

  function renderWebsite(content) {
    const site = getCloudData().site || {};
    const mode = (site.mode || "open").toLowerCase();
    const info = { open: { label: "ONLINE", color: "#4ade80", icon: "fa-circle-check" }, maintenance: { label: "MAINT", color: "#fbbf24", icon: "fa-screwdriver-wrench" }, update: { label: "UPDATE", color: "#6c7cff", icon: "fa-rocket" } }[mode] || { label: "ONLINE", color: "#4ade80", icon: "fa-circle-check" };
    content.innerHTML = `<div class="ad-banner" style="background:${info.color}15;border-color:${info.color}40;color:${info.color}"><i class="fa-solid ${info.icon}"></i> Status: <b style="margin-left:4px">${info.label}</b></div><div class="ad-mode"><button class="btn ${mode === 'open' ? 'btn-primary' : 'btn-ghost'}" data-mode="open">Open</button><button class="btn ${mode === 'maintenance' ? 'btn-wa' : 'btn-ghost'}" data-mode="maintenance">Maint</button><button class="btn ${mode === 'update' ? 'btn-primary' : 'btn-ghost'}" data-mode="update">Update</button></div><div class="ad-field"><label>Pesan</label><textarea data-w="msg" rows="3">${esc(site.maintenanceMessage || "")}</textarea></div><div class="ad-field"><label>ETA</label><input data-w="eta" value="${esc(site.maintenanceEta || "")}" placeholder="30 menit"></div><button class="btn btn-primary btn-block" data-save-site>Simpan</button>`;
    content.querySelectorAll("[data-mode]").forEach(b => b.onclick = async () => {
      getCloudData().site.mode = b.dataset.mode;
      await persistCloud();
      if (window.checkMaintenance) window.checkMaintenance();
      if (window.checkChangelog) window.checkChangelog();
      toast("Mode: " + b.dataset.mode.toUpperCase(), "success");
      render();
    });
    content.querySelector("[data-save-site]").onclick = async (e) => {
      getCloudData().site.maintenanceMessage = content.querySelector("[data-w='msg']").value.trim();
      getCloudData().site.maintenanceEta = content.querySelector("[data-w='eta']").value.trim();
      await saveBtn(e.target.closest("button"), "Simpan");
      if (window.checkMaintenance) window.checkMaintenance();
    };
  }

  async function renderHistory(content) {
    content.innerHTML = `<div style="text-align:center;padding:20px"><i class="fa-solid fa-spinner fa-spin" style="color:var(--primary)"></i><p style="margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--font-mono)">LOADING...</p></div>`;
    const versions = await cloudVersions();
    if (!versions.length) { content.innerHTML = `<div class="ad-empty">Belum ada versi.<br><small style="font-size:10.5px;color:var(--muted-2)">Versi otomatis tersimpan tiap klik Simpan.</small></div>`; return; }
    content.innerHTML = `<div class="ad-label">Versi (${versions.length})</div>${versions.map(v => `<div class="ver-item"><div><b style="font-size:12px">${new Date(v.timestamp).toLocaleString("id-ID")}</b><br><small>${(v.size / 1024).toFixed(1)} KB</small></div><button class="btn btn-ghost" data-restore="${v.id}" style="padding:7px 12px;font-size:11px"><i class="fa-solid fa-rotate-left"></i> Restore</button></div>`).join("")}<p style="font-size:10.5px;color:var(--muted-2);margin-top:12px;font-family:var(--font-mono)">⚠️ Restore akan menimpa data saat ini.</p>`;
    content.querySelectorAll("[data-restore]").forEach(b => b.onclick = async () => {
      if (!confirm("Restore versi ini?")) return;
      const data = await cloudRestore(b.dataset.restore);
      if (data) { setCloudData(ensureStructure(data)); refreshMain(); render(); toast("Direstore.", "success"); }
      else toast("Gagal.", "error");
    });
  }

  function refreshMain() {
    if (window.refreshAll) window.refreshAll();
    if (window.applyAdminMode) window.applyAdminMode();
    if (window.applyLogo) window.applyLogo();
  }

  document.querySelector("[data-ad-act='close']").onclick = closeAdminPanel;
  document.querySelector("[data-ad-act='logout']").onclick = async () => {
    if (!confirm("Logout admin?")) return;
    if (window.clearSession) window.clearSession();
    if (window.applyAdminMode) window.applyAdminMode();
    closeAdminPanel();
    toast("Logout berhasil.", "success");
  };
  document.querySelector("[data-ad-act='sync']").onclick = async () => {
    const d = await cloudLoad();
    if (!d) { toast("Gagal sync.", "error"); return; }
    setCloudData(ensureStructure(d));
    refreshMain(); render();
    toast("Synced.", "success");
  };
  document.querySelector("[data-ad-act='export']").onclick = () => {
    const blob = new Blob([JSON.stringify(getCloudData(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "msi-astra-data.json";
    a.click();
  };

  render();
})();
</script>
