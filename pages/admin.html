<style>
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-right:40px}
.ad-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ad-title i{color:var(--primary);font-size:15px}
.ad-logout{padding:6px 10px;font-size:10.5px}
.ad-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tabs button{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:var(--font-mono)}
.ad-tabs button.active{background:var(--primary);color:#000;border-color:var(--primary)}
.ad-list-btn{width:100%;margin-bottom:12px}
.ad-list{max-height:340px;overflow-y:auto;padding-right:4px}
.ad-item{padding:12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ad-item-info{flex:1;min-width:0;overflow:hidden}
.ad-item-info b{font-size:12.5px;display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-item-info small{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.ad-item-btns{display:flex;gap:5px;flex-shrink:0}
.ad-item-btns button{width:32px;height:32px;border-radius:9px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--primary);font-size:11px;display:grid;place-items:center}
.ad-item-btns button.del{color:#f87171}
.ad-empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border-strong);border-radius:12px}
.ad-footer{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.ad-footer .btn{flex:1;font-size:11px;padding:9px}
.ad-banner{padding:12px 16px;border-radius:13px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.3);color:#fbbf24;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:var(--font-mono)}
.ad-label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono)}
.ad-mode{display:flex;gap:6px;margin-bottom:16px}
.ad-mode .btn{flex:1;font-size:11px;padding:10px 6px}
.ad-field{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.ad-field label{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-family:var(--font-mono)}
.ad-field input,.ad-field textarea,.ad-field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.ad-field textarea{resize:vertical;min-height:80px}
.ad-field input:focus,.ad-field textarea:focus,.ad-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ad-theme-card{padding:14px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:14px}
.ad-theme-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ad-theme-title{display:flex;align-items:center;gap:10px}
.ad-theme-color{width:32px;height:32px;border-radius:9px}
.ad-theme-title b{font-size:13px}
.ad-color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ad-form-actions{display:flex;gap:8px;margin-top:16px}
</style>

<button class="modal-close" data-ad-act="close"><i class="fa-solid fa-xmark"></i></button>

<div class="ad-head">
  <div class="ad-title"><i class="fa-solid fa-sliders"></i> Admin Tools</div>
  <button class="btn btn-ghost ad-logout" data-ad-act="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</div>

<div class="ad-tabs" id="adTabs"></div>
<div id="adContent"></div>

<div class="ad-footer">
  <button class="btn btn-ghost" data-ad-act="sync"><i class="fa-solid fa-rotate"></i> Sync</button>
  <button class="btn btn-ghost" data-ad-act="export"><i class="fa-solid fa-download"></i> Export</button>
</div>

<script>
(function(){
  const $ = window.$;
  const esc = window.esc;
  const toast = window.toast;
  const getCloudData = window.getCloudData;
  const setCloudData = window.setCloudData;
  const persistCloud = window.persistCloud;
  const cloudLoad = window.cloudLoad;
  const ensureStructure = window.ensureStructure;
  const closeAdminPanel = window.closeAdminPanel;

  const TABS = {
    services: "Jasa",
    products: "Produk",
    payment:  "Payment",
    themes:   "Tema",
    sidebar:  "Sidebar",
    navbar:   "Navbar",
    pages:    "Pages",
    prefs:    "Preferensi",
    website:  "Website"
  };

  const FIELDS = {
    services: [
      { k:"name", l:"Nama Jasa", t:"text" },
      { k:"description", l:"Deskripsi", t:"textarea" },
      { k:"price", l:"Harga", t:"text" },
      { k:"status", l:"Status", t:"select", o:["Tersedia","Tidak Tersedia","Pre-Order","Coming Soon"] },
      { k:"icon", l:"Icon (fa-xxx)", t:"text" }
    ],
    products: [
      { k:"name", l:"Nama Produk", t:"text" },
      { k:"description", l:"Deskripsi", t:"textarea" },
      { k:"price", l:"Harga", t:"text" },
      { k:"status", l:"Status", t:"select", o:["Tersedia","Tidak Tersedia","Pre-Order","Coming Soon"] },
      { k:"icon", l:"Icon (fa-xxx)", t:"text" }
    ],
    payment: [
      { k:"id", l:"ID", t:"text" },
      { k:"name", l:"Nama", t:"text" },
      { k:"icon", l:"Icon", t:"text" },
      { k:"color", l:"Warna (hex)", t:"text" },
      { k:"type", l:"Tipe", t:"select", o:["qris","phone","url"] },
      { k:"value", l:"Value", t:"textarea" },
      { k:"status", l:"Status", t:"select", o:["available","unavailable","maintenance"] }
    ],
    sidebar: [
      { k:"id", l:"ID", t:"text" },
      { k:"label", l:"Label", t:"text" },
      { k:"desc", l:"Deskripsi", t:"text" },
      { k:"icon", l:"Icon (fa-xxx)", t:"text" },
      { k:"color", l:"Warna", t:"select", o:["","orange","green","purple"] },
      { k:"adminOnly", l:"Admin Only", t:"select", o:["false","true"] },
      { k:"type", l:"Tipe", t:"select", o:["page","builtin"] },
      { k:"target", l:"Target", t:"text" }
    ],
    navbar: [
      { k:"id", l:"ID", t:"text" },
      { k:"label", l:"Label", t:"text" },
      { k:"icon", l:"Icon (fa-xxx)", t:"text" },
      { k:"page", l:"Target Page", t:"text" }
    ]
  };

  let currentTab = "services";
  let editing = null;

  const saveBtn = async (btn, label) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const ok = await persistCloud();
    btn.disabled = false;
    btn.innerHTML = label;
    if(ok){ toast("Tersimpan.","success"); render(); }
    else toast("Gagal simpan.","error");
    return ok;
  };

  function render(){
    const content = $("#adContent"); if(!content) return;
    const tabsEl = $("#adTabs");
    tabsEl.innerHTML = Object.entries(TABS).map(([k,v]) =>
      `<button data-tab="${k}" class="${k===currentTab?'active':''}">${v}</button>`
    ).join("");
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      currentTab = b.dataset.tab;
      editing = null;
      render();
    });

    if(editing) return renderForm(content);
    if(currentTab === "themes") return renderThemes(content);
    if(currentTab === "pages") return renderPages(content);
    if(currentTab === "prefs") return renderPrefs(content);
    if(currentTab === "website") return renderWebsite(content);
    renderList(content);
  }

  function renderList(content){
    const data = getCloudData();
    const list = data[currentTab] || [];
    content.innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add><i class="fa-solid fa-plus"></i> Tambah ${TABS[currentTab]}</button>
      <div class="ad-list">
        ${list.length ? list.map((it,i) => `
          <div class="ad-item">
            <div class="ad-item-info">
              <b>${esc(it.name || it.label || it.id || "-")}</b>
              <small>${esc(it.status || it.price || it.value || it.desc || "")}</small>
            </div>
            <div class="ad-item-btns">
              <button data-edit="${i}"><i class="fa-solid fa-pen"></i></button>
              <button class="del" data-del="${i}"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`).join("") : '<div class="ad-empty">Belum ada data</div>'}
      </div>`;

    content.querySelector("[data-add]").onclick = () => { editing = { idx: -1 }; render(); };
    content.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { idx: Number(b.dataset.edit) }; render(); });
    content.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const i = Number(b.dataset.del);
      const it = getCloudData()[currentTab][i];
      const name = it?.name || it?.label || it?.id || "item";
      if(!confirm(`Hapus "${name}"?`)) return;
      getCloudData()[currentTab].splice(i, 1);
      await persistCloud();
      refreshMain();
      render();
      toast("Dihapus.","success");
    });
  }

  function renderForm(content){
    const data = getCloudData();
    const fields = FIELDS[currentTab] || [];
    const isNew = editing.idx < 0;
    const item = isNew ? {} : (data[currentTab][editing.idx] || {});

    content.innerHTML = `
      <div class="ad-label">${isNew ? "Tambah" : "Edit"} ${TABS[currentTab]}</div>
      ${fields.map(f => {
        const v = item[f.k] ?? "";
        if(f.t === "textarea") return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-f="${f.k}" rows="3">${esc(v)}</textarea></div>`;
        if(f.t === "select") return `<div class="ad-field"><label>${esc(f.l)}</label><select data-f="${f.k}">${f.o.map(o => `<option value="${esc(o)}" ${String(o)==String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
        return `<div class="ad-field"><label>${esc(f.l)}</label><input type="text" data-f="${f.k}" value="${esc(v)}"></div>`;
      }).join("")}
      <div class="ad-form-actions">
        <button class="btn btn-ghost" data-cancel style="flex:1">Batal</button>
        <button class="btn btn-primary" data-save style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      </div>`;

    content.querySelector("[data-cancel]").onclick = () => { editing = null; render(); };
    content.querySelector("[data-save]").onclick = async (e) => {
      const obj = {};
      fields.forEach(f => {
        const el = content.querySelector(`[data-f="${f.k}"]`);
        let val = el ? el.value.trim() : "";
        if(f.k === "adminOnly") val = val === "true";
        obj[f.k] = val;
      });
      if(!obj.name && !obj.label && !obj.id){ toast("Field wajib belum diisi.","error"); return; }

      if(isNew) getCloudData()[currentTab].push(obj);
      else getCloudData()[currentTab][editing.idx] = obj;

      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if(ok){ editing = null; refreshMain(); }
    };
  }

  function renderThemes(content){
    const themes = getCloudData().themes;
    const active = themes.active || "t1";
    content.innerHTML = `
      <div class="ad-label">Tema Default Aktif</div>
      <div class="ad-mode">
        ${["t1","t2"].map(k => `<button class="btn ${active===k?'btn-primary':'btn-ghost'}" data-default="${k}"><i class="fa-solid fa-palette"></i> ${esc(themes[k].name)}</button>`).join("")}
      </div>
      ${["t1","t2"].map(k => themeCard(k, themes[k])).join("")}`;

    content.querySelectorAll("[data-default]").forEach(b => b.onclick = async () => {
      getCloudData().themes.active = b.dataset.default;
      const ok = await persistCloud();
      if(ok){ toast("Default updated.","success"); render(); }
    });

    ["t1","t2"].forEach(k => {
      content.querySelector(`[data-th-save="${k}"]`).onclick = async (e) => {
        const t = getCloudData().themes[k];
        const get = (suffix) => content.querySelector(`[data-th="${k}-${suffix}"]`).value.trim();
        t.name = get("name") || t.name;
        t.primary = get("primary") || t.primary;
        t.secondary = get("secondary") || t.secondary;
        t.bgImage = get("bg");
        t.bgOpacity = parseFloat(get("opacity")) || 0.15;
        t.banner = { title: get("btitle"), desc: get("bdesc"), image: get("bimg") };
        const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
        if(ok && window.applyTheme) window.applyTheme(k);
      };
    });
  }

  function themeCard(k, t){
    return `
      <div class="ad-theme-card">
        <div class="ad-theme-head">
          <div class="ad-theme-title">
            <div class="ad-theme-color" style="background:linear-gradient(135deg,${t.primary},${t.secondary})"></div>
            <b>${esc(t.name)}</b>
          </div>
        </div>
        <div class="ad-field"><label>Nama</label><input data-th="${k}-name" value="${esc(t.name)}"></div>
        <div class="ad-color-grid">
          <div class="ad-field"><label>Primary</label><input data-th="${k}-primary" value="${esc(t.primary)}"></div>
          <div class="ad-field"><label>Secondary</label><input data-th="${k}-secondary" value="${esc(t.secondary)}"></div>
        </div>
        <div class="ad-field"><label>Background URL</label><input data-th="${k}-bg" value="${esc(t.bgImage||"")}"></div>
        <div class="ad-field"><label>BG Opacity (0-1)</label><input type="number" step="0.05" min="0" max="1" data-th="${k}-opacity" value="${t.bgOpacity||0.15}"></div>
        <div class="ad-label" style="margin-top:10px">Banner</div>
        <div class="ad-field"><label>Judul</label><input data-th="${k}-btitle" value="${esc(t.banner?.title||"")}"></div>
        <div class="ad-field"><label>Deskripsi</label><input data-th="${k}-bdesc" value="${esc(t.banner?.desc||"")}"></div>
        <div class="ad-field"><label>URL Gambar</label><input data-th="${k}-bimg" value="${esc(t.banner?.image||"")}"></div>
        <button class="btn btn-primary btn-block" data-th-save="${k}"><i class="fa-solid fa-floppy-disk"></i> Simpan Tema</button>
      </div>`;
  }

  function renderPages(content){
    const pages = getCloudData().pages || {};
    const ids = Object.keys(pages);
    content.innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add-page><i class="fa-solid fa-plus"></i> Tambah Page</button>
      <div class="ad-list">
        ${ids.length ? ids.map(id => {
          const p = pages[id];
          return `<div class="ad-item">
            <div class="ad-item-info">
              <b>${esc(p.title || id)}</b>
              <small>${esc(id)} · ${p.custom ? "CUSTOM" : "BUILTIN"}</small>
            </div>
            <div class="ad-item-btns">
              <button data-edit-page="${esc(id)}"><i class="fa-solid fa-pen"></i></button>
              ${p.custom ? `<button class="del" data-del-page="${esc(id)}"><i class="fa-solid fa-trash"></i></button>` : ''}
            </div>
          </div>`;
        }).join("") : '<div class="ad-empty">Belum ada page</div>'}
      </div>`;

    content.querySelector("[data-add-page]").onclick = () => {
      const id = prompt("ID page (lowercase, contoh: galeri):");
      if(!id || !/^[a-z0-9_-]+$/.test(id)){ toast("ID harus lowercase.","error"); return; }
      if(getCloudData().pages[id]){ toast("ID udah dipakai.","error"); return; }
      getCloudData().pages[id] = { title: id, subtitle: "", custom: true, html: "<p>Edit HTML di sini...</p>" };
      persistCloud().then(() => render());
    };

    content.querySelectorAll("[data-edit-page]").forEach(b => b.onclick = () => {
      const id = b.dataset.editPage;
      const p = getCloudData().pages[id];
      content.innerHTML = `
        <div class="ad-label">Edit Page: ${esc(id)}</div>
        <div class="ad-field"><label>ID</label><input data-pf="id" value="${esc(id)}"></div>
        <div class="ad-field"><label>Judul</label><input data-pf="title" value="${esc(p.title||"")}"></div>
        <div class="ad-field"><label>Subjudul</label><input data-pf="subtitle" value="${esc(p.subtitle||"")}"></div>
        <div class="ad-field"><label>Custom HTML?</label><select data-pf="custom"><option value="true" ${p.custom?"selected":""}>true</option><option value="false" ${!p.custom?"selected":""}>false</option></select></div>
        <div class="ad-field"><label>HTML Content</label><textarea data-pf="html" rows="8">${esc(p.html||"")}</textarea></div>
        <div class="ad-form-actions">
          <button class="btn btn-ghost" data-cancel style="flex:1">Batal</button>
          <button class="btn btn-primary" data-save-page style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>`;
      content.querySelector("[data-cancel]").onclick = () => render();
      content.querySelector("[data-save-page]").onclick = async (e) => {
        const newId = content.querySelector("[data-pf='id']").value.trim();
        const data = {
          title: content.querySelector("[data-pf='title']").value.trim(),
          subtitle: content.querySelector("[data-pf='subtitle']").value.trim(),
          custom: content.querySelector("[data-pf='custom']").value === "true",
          html: content.querySelector("[data-pf='html']").value
        };
        if(newId !== id) delete getCloudData().pages[id];
        getCloudData().pages[newId] = data;
        const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
        if(ok) render();
      };
    });

    content.querySelectorAll("[data-del-page]").forEach(b => b.onclick = async () => {
      const id = b.dataset.delPage;
      if(!confirm(`Hapus page "${id}"?`)) return;
      delete getCloudData().pages[id];
      await persistCloud();
      render();
    });
  }

  function renderPrefs(content){
    const p = getCloudData().preferences;
    const d = p.developer;
    content.innerHTML = `
      <div class="ad-field"><label>App Name</label><input data-p="appName" value="${esc(p.appName)}"></div>
      <div class="ad-field"><label>App Subtitle</label><input data-p="appSubtitle" value="${esc(p.appSubtitle)}"></div>
      <div class="ad-field"><label>Hero Badge</label><input data-p="heroBadge" value="${esc(p.heroBadge)}"></div>
      <div class="ad-field"><label>Hero Subtitle</label><input data-p="heroSubtitle" value="${esc(p.heroSubtitle)}"></div>
      <div class="ad-field"><label>Hero Rotate (pisah dengan |)</label><textarea data-p="heroRotate" rows="3">${esc((p.heroRotate||[]).join(" | "))}</textarea></div>
      <div class="ad-field"><label>Developer Name</label><input data-p="devName" value="${esc(d.name)}"></div>
      <div class="ad-field"><label>Username</label><input data-p="devUser" value="${esc(d.username)}"></div>
      <div class="ad-field"><label>Role</label><input data-p="devRole" value="${esc(d.role)}"></div>
      <div class="ad-field"><label>Avatar URL</label><input data-p="devProfile" value="${esc(d.profileImage)}"></div>
      <div class="ad-field"><label>Description</label><textarea data-p="devDesc" rows="3">${esc(d.description)}</textarea></div>
      <div class="ad-field"><label>Quote</label><input data-p="devQuote" value="${esc(d.quote)}"></div>
      <div class="ad-field"><label>Currently</label><input data-p="devCurrent" value="${esc(d.currently)}"></div>
      <div class="ad-field"><label>WhatsApp URL</label><input data-p="wa" value="${esc(p.contact.whatsapp)}"></div>
      <div class="ad-field"><label>Channel URL</label><input data-p="channel" value="${esc(p.contact.channel)}"></div>
      <div class="ad-field"><label>Daily Limit Lapor</label><input type="number" data-p="dailyLimit" value="${p.dailyLimit||5}"></div>
      <div class="ad-field"><label>Discord Webhook URL</label><input data-p="webhook" value="${esc(p.webhookSaran||"")}"></div>
      <button class="btn btn-primary btn-block" data-save-prefs><i class="fa-solid fa-floppy-disk"></i> Simpan</button>`;

    content.querySelector("[data-save-prefs]").onclick = async (e) => {
      const g = (k) => content.querySelector(`[data-p="${k}"]`).value.trim();
      p.appName = g("appName") || p.appName;
      p.appSubtitle = g("appSubtitle");
      p.heroBadge = g("heroBadge");
      p.heroSubtitle = g("heroSubtitle");
      p.heroRotate = g("heroRotate").split("|").map(x => x.trim()).filter(Boolean);
      d.name = g("devName");
      d.username = g("devUser");
      d.role = g("devRole");
      d.profileImage = g("devProfile");
      d.description = g("devDesc");
      d.quote = g("devQuote");
      d.currently = g("devCurrent");
      p.contact.whatsapp = g("wa");
      p.contact.channel = g("channel");
      p.dailyLimit = parseInt(g("dailyLimit")) || 5;
      p.webhookSaran = g("webhook");
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if(ok && window.renderPreferences) window.renderPreferences();
    };
  }

  function renderWebsite(content){
    const site = getCloudData().site || {};
    const mode = (site.mode || "open").toLowerCase();
    const info = {
      open: { label: "ONLINE", color: "#4ade80", icon: "fa-circle-check", desc: "Website online" },
      maintenance: { label: "MAINTENANCE", color: "#fbbf24", icon: "fa-screwdriver-wrench", desc: "User lihat popup maintenance" },
      update: { label: "UPDATE", color: "#6c7cff", icon: "fa-rocket", desc: "User lihat changelog popup" }
    }[mode] || { label: "ONLINE", color: "#4ade80", icon: "fa-circle-check", desc: "Website online" };

    content.innerHTML = `
      <div class="ad-banner" style="background:${info.color}15;border-color:${info.color}40;color:${info.color}">
        <i class="fa-solid ${info.icon}"></i> Status: <b style="margin-left:4px">${info.label}</b>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-bottom:14px">${esc(info.desc)}</p>
      <div class="ad-label">Mode Website</div>
      <div class="ad-mode">
        <button class="btn ${mode==='open'?'btn-primary':'btn-ghost'}" data-mode="open"><i class="fa-solid fa-circle-check"></i> Open</button>
        <button class="btn ${mode==='maintenance'?'btn-wa':'btn-ghost'}" data-mode="maintenance"><i class="fa-solid fa-screwdriver-wrench"></i> Maint</button>
        <button class="btn ${mode==='update'?'btn-primary':'btn-ghost'}" data-mode="update"><i class="fa-solid fa-rocket"></i> Update</button>
      </div>
      <div class="ad-field"><label>Pesan Maintenance</label><textarea data-w="msg" rows="3">${esc(site.maintenanceMessage||"")}</textarea></div>
      <div class="ad-field"><label>Estimasi</label><input data-w="eta" value="${esc(site.maintenanceEta||"")}" placeholder="30 menit"></div>
      <button class="btn btn-primary btn-block" data-save-site><i class="fa-solid fa-floppy-disk"></i> Simpan</button>`;

    content.querySelectorAll("[data-mode]").forEach(b => b.onclick = async () => {
      getCloudData().site.mode = b.dataset.mode;
      await persistCloud();
      if(window.checkMaintenance) window.checkMaintenance();
      if(window.checkChangelog) window.checkChangelog();
      toast("Mode: " + b.dataset.mode.toUpperCase(), "success");
      render();
    });

    content.querySelector("[data-save-site]").onclick = async (e) => {
      getCloudData().site.maintenanceMessage = content.querySelector("[data-w='msg']").value.trim() || "Website lagi diperbaiki.";
      getCloudData().site.maintenanceEta = content.querySelector("[data-w='eta']").value.trim();
      await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if(window.checkMaintenance) window.checkMaintenance();
    };
  }

  function refreshMain(){
    if(window.refreshAll) window.refreshAll();
    if(window.applyAdminMode) window.applyAdminMode();
  }

  // Top actions
  document.querySelector("[data-ad-act='close']").onclick = closeAdminPanel;
  document.querySelector("[data-ad-act='logout']").onclick = async () => {
    if(!confirm("Logout admin?")) return;
    const data = getCloudData();
    if(data?.admin){
      data.admin.claimed = false;
      data.admin.ownerId = null;
      data.admin.claimedAt = null;
      await persistCloud();
    }
    localStorage.removeItem("msi_session");
    if(window.applyAdminMode) window.applyAdminMode();
    closeAdminPanel();
    toast("Logout.","success");
  };
  document.querySelector("[data-ad-act='sync']").onclick = async () => {
    const d = await cloudLoad();
    if(!d){ toast("Gagal sync.","error"); return; }
    setCloudData(ensureStructure(d));
    refreshMain();
    render();
    toast("Synced.","success");
  };
  document.querySelector("[data-ad-act='export']").onclick = () => {
    const blob = new Blob([JSON.stringify(getCloudData(), null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "msi-astra-data.json";
    a.click();
  };

  render();
})();
</script>
