<style>
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;padding-right:40px}
.ad-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ad-title i{color:var(--primary);font-size:15px}
.ad-logout{padding:6px 10px;font-size:10.5px}
.ad-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tabs button{flex-shrink:0;padding:9px 14px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:var(--font-mono);transition:all .25s}
.ad-tabs button.active{background:var(--primary);color:#000;border-color:var(--primary)}
.ad-list-btn{width:100%;margin-bottom:12px}
.ad-list{max-height:400px;overflow-y:auto;padding-right:4px}
.ad-item{padding:12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ad-item-info{flex:1;min-width:0;overflow:hidden}
.ad-item-info b{font-size:12.5px;display:block;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-item-info small{font-size:10.5px;color:var(--muted);font-family:var(--font-mono);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-item-btns{display:flex;gap:5px;flex-shrink:0}
.ad-item-btns button{width:32px;height:32px;border-radius:9px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);color:var(--primary);font-size:11px;display:grid;place-items:center}
.ad-item-btns button.del{color:#f87171}
.ad-empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px;border:1px dashed var(--border-strong);border-radius:12px}
.ad-footer{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.ad-footer .btn{flex:1;font-size:11px;padding:9px}
.ad-banner{padding:12px 16px;border-radius:13px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fbbf24;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:var(--font-mono)}
.ad-label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;font-family:var(--font-mono)}
.ad-mode{display:flex;gap:6px;margin-bottom:16px}
.ad-mode .btn{flex:1;font-size:11px;padding:10px 6px}
.ad-field{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.ad-field label{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-family:var(--font-mono)}
.ad-field input,.ad-field textarea,.ad-field select{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.ad-field textarea{resize:vertical;min-height:80px}
.ad-field input:focus,.ad-field textarea:focus,.ad-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ad-theme-card{padding:14px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:14px}
.ad-theme-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ad-theme-title{display:flex;align-items:center;gap:10px}
.ad-theme-color{width:32px;height:32px;border-radius:9px}
.ad-theme-title b{font-size:13px}
.ad-color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ad-form-actions{display:flex;gap:8px;margin-top:16px}
.ad-img-input{display:flex;gap:6px;align-items:stretch}
.ad-img-input input[type="text"]{flex:1;padding:12px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
.ad-img-btn{flex-shrink:0;padding:0 14px;border-radius:12px;background:var(--primary);color:#000;font-size:11.5px;font-weight:700;font-family:var(--font-mono);cursor:pointer;border:1px solid var(--primary);display:inline-flex;align-items:center;gap:6px;transition:all .25s}
.ad-img-btn:active{transform:scale(.95)}
.ad-img-preview{margin-top:8px;padding:8px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);text-align:center}
.ad-img-preview img{max-width:100%;max-height:160px;border-radius:8px;object-fit:cover}
.ad-dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.ad-stat{padding:14px;border-radius:14px;border:1px solid;display:flex;flex-direction:column;gap:4px}
.ad-stat .num{font-size:22px;font-weight:800;font-family:var(--font-mono);line-height:1}
.ad-stat .lbl{font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-family:var(--font-mono);opacity:.8}
.ad-card{padding:14px;border-radius:14px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:12px}
</style>

<button class="modal-close" data-ad-act="close"><i class="fa-solid fa-xmark"></i></button>

<div class="ad-head">
  <div class="ad-title"><i class="fa-solid fa-sliders"></i> Admin Tools</div>
  <button class="btn btn-ghost ad-logout" data-ad-act="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</div>

<div class="ad-tabs" id="adTabs"></div>
<div id="adContent"></div>

<div class="ad-footer">
  <button class="btn btn-ghost" data-ad-act="sync"><i class="fa-solid fa-rotate"></i> Sync</button>
  <button class="btn btn-ghost" data-ad-act="export"><i class="fa-solid fa-download"></i> Export</button>
</div>

<script>
(function () {
  const $ = window.$;
  const esc = window.esc;
  const toast = window.toast;
  const getCloudData = window.getCloudData;
  const setCloudData = window.setCloudData;
  const persistCloud = window.persistCloud;
  const cloudLoad = window.cloudLoad;
  const closeAdminPanel = window.closeAdminPanel;

  const TABS = {
    dashboard: "📊 Dashboard",
    services: "Jasa",
    products: "Produk",
    payment: "Payment",
    tools: "🔧 Tools",
    themes: "Tema",
    sidebar: "Sidebar",
    navbar: "Navbar",
    pages: "Pages",
    prefs: "Preferensi",
    website: "Website",
    history: "History"
  };

  const FIELDS = {
    services: [
      { k: "name", l: "Nama Jasa", t: "text" },
      { k: "description", l: "Deskripsi", t: "textarea" },
      { k: "image", l: "Gambar", t: "text" },
      { k: "price", l: "Harga", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["Tersedia", "Tidak Tersedia", "Pre-Order", "Coming Soon"] },
      { k: "icon", l: "Icon", t: "text" }
    ],
    products: [
      { k: "name", l: "Nama Produk", t: "text" },
      { k: "description", l: "Deskripsi", t: "textarea" },
      { k: "image", l: "Gambar", t: "text" },
      { k: "price", l: "Harga", t: "text" },
      { k: "status", l: "Status", t: "select", o: ["Tersedia", "Tidak Tersedia", "Pre-Order", "Coming Soon"] },
      { k: "icon", l: "Icon", t: "text" }
    ],
    payment: [
      { k: "id", l: "ID", t: "text" },
      { k: "name", l: "Nama", t: "text" },
      { k: "icon", l: "Icon", t: "text" },
      { k: "color", l: "Warna", t: "text" },
      { k: "type", l: "Tipe", t: "select", o: ["qris", "phone", "url"] },
      { k: "value", l: "Value / QRIS", t: "image-or-text" },
      { k: "status", l: "Status", t: "select", o: ["available", "unavailable", "maintenance"] }
    ],
    sidebar: [
      { k: "id", l: "ID", t: "text" },
      { k: "label", l: "Label", t: "text" },
      { k: "desc", l: "Deskripsi", t: "text" },
      { k: "icon", l: "Icon", t: "text" },
      { k: "color", l: "Warna", t: "select", o: ["", "orange", "green", "purple"] },
      { k: "adminOnly", l: "Admin Only", t: "select", o: ["false", "true"] },
      { k: "type", l: "Tipe", t: "select", o: ["page", "builtin"] },
      { k: "target", l: "Target", t: "text" }
    ],
    navbar: [
      { k: "id", l: "ID", t: "text" },
      { k: "label", l: "Label", t: "text" },
      { k: "icon", l: "Icon", t: "text" },
      { k: "page", l: "Target", t: "text" }
    ]
  };

  let currentTab = "dashboard";
  let editing = null;

  try { const s = sessionStorage.getItem("msi_admin_tab"); if (s && TABS[s]) currentTab = s; } catch (e) {}

  const saveBtn = async (btn, label) => {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const ok = await persistCloud();
    btn.disabled = false;
    btn.innerHTML = label;
    if (ok) { toast("Tersimpan.", "success"); render(); if (window.refreshAll) window.refreshAll(); }
    else toast("Gagal simpan.", "error");
    return ok;
  };

  function render() {
    const content = $("#adContent"); if (!content) return;
    const tabsEl = $("#adTabs");
    tabsEl.innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === currentTab ? 'active' : ''}">${v}</button>`).join("");
    tabsEl.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      currentTab = b.dataset.tab;
      editing = null;
      try { sessionStorage.setItem("msi_admin_tab", currentTab); } catch (e) {}
      render();
    });

    if (editing) return renderForm(content);
    if (currentTab === "dashboard") return renderDashboard(content);
    if (currentTab === "tools") return renderTools(content);
    if (currentTab === "themes") return renderThemes(content);
    if (currentTab === "pages") return renderPages(content);
    if (currentTab === "prefs") return renderPrefs(content);
    if (currentTab === "website") return renderWebsite(content);
    if (currentTab === "history") return renderHistory(content);
    renderList(content);
  }

  /* ===== DASHBOARD ===== */
  function renderDashboard(c) {
    const d = getCloudData() || {};
    const toolsActive = (d.tools || []).filter(t => t.enabled !== false).length;
    const siteMode = (d.site?.mode || "open").toLowerCase();
    const modeColor = { open: "#4ade80", maintenance: "#fbbf24", update: "#6c7cff" }[siteMode] || "#4ade80";
    const modeLabel = { open: "ONLINE", maintenance: "MAINTENANCE", update: "UPDATE" }[siteMode] || "ONLINE";

    let session = {};
    try { session = JSON.parse(localStorage.getItem("msi_session") || "{}"); } catch (e) {}

    c.innerHTML = `
      <div class="ad-label">Overview</div>
      <div class="ad-dash">
        <div class="ad-stat" style="background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.3);color:#60a5fa">
          <div class="num">${(d.services || []).length}</div>
          <div class="lbl">Jasa</div>
        </div>
        <div class="ad-stat" style="background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#4ade80">
          <div class="num">${(d.products || []).length}</div>
          <div class="lbl">Produk</div>
        </div>
        <div class="ad-stat" style="background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fbbf24">
          <div class="num">${toolsActive}</div>
          <div class="lbl">Tools Aktif</div>
        </div>
        <div class="ad-stat" style="background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3);color:#c084fc">
          <div class="num">${(d.sidebar || []).length}</div>
          <div class="lbl">Menu</div>
        </div>
      </div>

      <div class="ad-label">Status Website</div>
      <div class="ad-card" style="background:${modeColor}14;border-color:${modeColor}40;color:${modeColor};display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px">
        <i class="fa-solid fa-circle" style="font-size:8px"></i>
        <b>${modeLabel}</b>
        <span style="font-size:10.5px;color:var(--muted);margin-left:auto">${esc(d.site?.maintenanceMessage || "Normal")}</span>
      </div>

      <div class="ad-label">Session Admin</div>
      <div class="ad-card">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:grid;place-items:center;color:#000;font-weight:800;font-size:13px">${(session.user || 'A')[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${esc(session.user || 'Admin')}</div>
            <div style="font-size:10.5px;color:var(--muted);font-family:var(--font-mono)">Single user · ${session.exp ? new Date(session.exp).toLocaleDateString("id-ID") : "active"}</div>
          </div>
        </div>
      </div>

      <div class="ad-label">Quick Actions</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <button class="btn btn-ghost" data-qtab="services"><i class="fa-solid fa-screwdriver-wrench"></i> Jasa</button>
        <button class="btn btn-ghost" data-qtab="tools"><i class="fa-solid fa-toolbox"></i> Tools</button>
        <button class="btn btn-ghost" data-qtab="themes"><i class="fa-solid fa-palette"></i> Tema</button>
        <button class="btn btn-ghost" data-qtab="website"><i class="fa-solid fa-globe"></i> Website</button>
      </div>
      <p style="font-size:10.5px;color:var(--muted-2);font-family:var(--font-mono);line-height:1.6">
        ℹ️ Multi-user admin tidak tersedia di arsitektur single-admin. Butuh backend + database baru.
      </p>`;

    c.querySelectorAll("[data-qtab]").forEach(b => b.onclick = () => {
      currentTab = b.dataset.qtab;
      try { sessionStorage.setItem("msi_admin_tab", currentTab); } catch (e) {}
      render();
    });
  }

  /* ===== TOOLS ===== */
  function renderTools(c) {
    const list = getCloudData().tools || [];
    c.innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add-tool><i class="fa-solid fa-plus"></i> Tambah Tool Baru</button>
      <div class="ad-banner"><i class="fa-solid fa-circle-info"></i> Total: ${list.length} tools · ${list.filter(t => t.enabled !== false).length} aktif</div>
      <div class="ad-list">
        ${list.length ? list.map((t, i) => `
          <div class="ad-item">
            <div class="ad-item-info">
              <b><i class="${esc(t.icon || 'fa-solid fa-toolbox')}" style="color:${esc(t.color || 'var(--primary)')};margin-right:6px"></i>${esc(t.name)}</b>
              <small>${esc(t.cat || "-")} · ${(t.params || []).length} param · ${t.enabled !== false ? "ON" : "OFF"}</small>
            </div>
            <div class="ad-item-btns">
              <button data-toggle="${i}" title="Toggle"><i class="fa-solid ${t.enabled !== false ? 'fa-toggle-on' : 'fa-toggle-off'}"></i></button>
              <button data-edit="${i}" title="Edit"><i class="fa-solid fa-pen"></i></button>
              <button class="del" data-del="${i}" title="Hapus"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`).join("") : '<div class="ad-empty">Belum ada tools</div>'}
      </div>`;

    c.querySelector("[data-add-tool]").onclick = () => renderToolForm(c, null);
    c.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
      const t = getCloudData().tools[+b.dataset.toggle];
      t.enabled = t.enabled === false ? true : false;
      await persistCloud();
      render();
      toast("Tools: " + (t.enabled ? "ON" : "OFF"), "success");
    });
    c.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => renderToolForm(c, +b.dataset.edit));
    c.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const i = +b.dataset.del;
      if (!confirm(`Hapus tool "${getCloudData().tools[i].name}"?`)) return;
      getCloudData().tools.splice(i, 1);
      await persistCloud();
      render();
      toast("Dihapus.", "success");
    });
  }

  function renderToolForm(c, idx) {
    const isNew = idx === null;
    const t = isNew
      ? { id: "", name: "", desc: "", icon: "fa-solid fa-toolbox", color: "", cat: "downloader", api: "", params: [{ key: "url", label: "URL", type: "url", placeholder: "", required: true }], enabled: true }
      : JSON.parse(JSON.stringify(getCloudData().tools[idx]));

    c.innerHTML = `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <button class="btn btn-ghost" id="tfBack" style="padding:8px 12px"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="ad-label" style="margin:0">${isNew ? "Tambah" : "Edit"} Tool</div>
      </div>
      <div class="ad-field"><label>Nama Tool</label><input id="tfName" value="${esc(t.name)}" placeholder="Instagram Downloader"></div>
      <div class="ad-field"><label>Deskripsi</label><input id="tfDesc" value="${esc(t.desc)}" placeholder="Download video, foto, reels"></div>
      <div class="ad-color-grid">
        <div class="ad-field"><label>Icon (FontAwesome)</label><input id="tfIcon" value="${esc(t.icon)}" placeholder="fa-solid fa-toolbox"></div>
        <div class="ad-field"><label>Warna (hex)</label><input id="tfColor" value="${esc(t.color)}" placeholder="#60a5fa"></div>
      </div>
      <div class="ad-field"><label>Kategori</label>
        <select id="tfCat">
          <option value="downloader" ${t.cat === 'downloader' ? 'selected' : ''}>Downloader</option>
          <option value="maker" ${t.cat === 'maker' ? 'selected' : ''}>Maker</option>
          <option value="image" ${t.cat === 'image' ? 'selected' : ''}>Image</option>
          <option value="web" ${t.cat === 'web' ? 'selected' : ''}>Web</option>
          <option value="info" ${t.cat === 'info' ? 'selected' : ''}>Info</option>
        </select>
      </div>
      <div class="ad-field"><label>API URL</label><input id="tfApi" value="${esc(t.api)}" placeholder="https://api.example.com/endpoint"></div>

      <div class="ad-label" style="margin-top:14px">Parameter Form</div>
      <div id="tfParams"></div>
      <button type="button" class="btn btn-ghost btn-block" id="tfAddParam" style="margin-top:8px"><i class="fa-solid fa-plus"></i> Tambah Parameter</button>

      <div class="ad-field" style="margin-top:12px">
        <label>Status</label>
        <select id="tfEnabled">
          <option value="true" ${t.enabled !== false ? 'selected' : ''}>Aktif</option>
          <option value="false" ${t.enabled === false ? 'selected' : ''}>Nonaktif</option>
        </select>
      </div>

      <div class="ad-form-actions">
        <button class="btn btn-ghost" id="tfCancel" style="flex:1">Batal</button>
        <button class="btn btn-primary" id="tfSave" style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      </div>`;

    const params = t.params || [];
    function renderParams() {
      const wrap = c.querySelector("#tfParams");
      if (!params.length) { wrap.innerHTML = '<p style="font-size:11px;color:var(--muted);padding:8px;font-family:var(--font-mono)">Belum ada parameter. Tool tidak butuh input?</p>'; return; }
      wrap.innerHTML = params.map((p, i) => `
        <div style="padding:12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px;position:relative">
          <button type="button" data-rmparam="${i}" style="position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;font-size:11px;cursor:pointer;display:grid;place-items:center"><i class="fa-solid fa-xmark"></i></button>
          <div class="ad-color-grid" style="margin-bottom:6px">
            <div class="ad-field" style="margin:0"><label style="font-size:9.5px">Key</label><input data-pk="${i}" value="${esc(p.key || '')}" placeholder="url"></div>
            <div class="ad-field" style="margin:0"><label style="font-size:9.5px">Label</label><input data-pl="${i}" value="${esc(p.label || '')}" placeholder="URL Input"></div>
          </div>
          <div class="ad-color-grid">
            <div class="ad-field" style="margin:0"><label style="font-size:9.5px">Type</label>
              <select data-pt="${i}">
                <option value="text" ${p.type === 'text' ? 'selected' : ''}>Text</option>
                <option value="url" ${p.type === 'url' ? 'selected' : ''}>URL</option>
              </select>
            </div>
            <div class="ad-field" style="margin:0"><label style="font-size:9.5px">Placeholder</label><input data-pp="${i}" value="${esc(p.placeholder || '')}"></div>
          </div>
        </div>`).join("");
      wrap.querySelectorAll("[data-pk]").forEach(i => i.oninput = () => { params[+i.dataset.pk].key = i.value; });
      wrap.querySelectorAll("[data-pl]").forEach(i => i.oninput = () => { params[+i.dataset.pl].label = i.value; });
      wrap.querySelectorAll("[data-pt]").forEach(i => i.onchange = () => { params[+i.dataset.pt].type = i.value; });
      wrap.querySelectorAll("[data-pp]").forEach(i => i.oninput = () => { params[+i.dataset.pp].placeholder = i.value; });
      wrap.querySelectorAll("[data-rmparam]").forEach(b => b.onclick = () => { params.splice(+b.dataset.rmparam, 1); renderParams(); });
    }
    renderParams();

    c.querySelector("#tfAddParam").onclick = () => {
      params.push({ key: "text", label: "Teks", type: "text", placeholder: "", required: true });
      renderParams();
    };
    c.querySelector("#tfBack").onclick = c.querySelector("#tfCancel").onclick = () => render();
    c.querySelector("#tfSave").onclick = async (e) => {
      const name = c.querySelector("#tfName").value.trim();
      const api = c.querySelector("#tfApi").value.trim();
      if (!name) { toast("Nama wajib", "error"); return; }
      if (!api) { toast("API URL wajib", "error"); return; }
      const obj = {
        id: t.id || name.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Math.random().toString(36).slice(2, 5),
        name,
        desc: c.querySelector("#tfDesc").value.trim(),
        icon: c.querySelector("#tfIcon").value.trim() || "fa-solid fa-toolbox",
        color: c.querySelector("#tfColor").value.trim(),
        cat: c.querySelector("#tfCat").value,
        api,
        params,
        enabled: c.querySelector("#tfEnabled").value === "true"
      };
      if (!Array.isArray(getCloudData().tools)) getCloudData().tools = [];
      if (isNew) getCloudData().tools.push(obj);
      else getCloudData().tools[idx] = obj;
      const btn = e.target.closest("button");
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      const ok = await persistCloud();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan';
      if (ok) { toast("Tersimpan.", "success"); render(); }
      else toast("Gagal.", "error");
    };
  }

  /* ===== LIST/FORM (Jasa, Produk, dll) ===== */
  function renderList(c) {
    const list = getCloudData()[currentTab] || [];
    c.innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add><i class="fa-solid fa-plus"></i> Tambah ${TABS[currentTab]}</button>
      <div class="ad-list">
        ${list.length ? list.map((it, i) => `
          <div class="ad-item">
            <div class="ad-item-info"><b>${esc(it.name || it.label || it.id || "-")}</b><small>${esc(it.status || it.price || it.value || it.desc || "")}</small></div>
            <div class="ad-item-btns">
              <button data-edit="${i}"><i class="fa-solid fa-pen"></i></button>
              <button class="del" data-del="${i}"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`).join("") : '<div class="ad-empty">Belum ada data</div>'}
      </div>`;
    c.querySelector("[data-add]").onclick = () => { editing = { idx: -1 }; render(); };
    c.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { editing = { idx: +b.dataset.edit }; render(); });
    c.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const i = +b.dataset.del;
      const it = getCloudData()[currentTab][i];
      if (!confirm(`Hapus "${it?.name || it?.label || it?.id || "item"}"?`)) return;
      getCloudData()[currentTab].splice(i, 1);
      await persistCloud();
      if (window.refreshAll) window.refreshAll();
      render();
      toast("Dihapus.", "success");
    });
  }

  function renderForm(c) {
    const data = getCloudData();
    const fields = FIELDS[currentTab] || [];
    const isNew = editing.idx < 0;
    const item = isNew ? {} : (data[currentTab][editing.idx] || {});
    const isImg = k => ["image", "bimg", "avatar", "screenshot"].includes((k || "").toLowerCase());

    c.innerHTML = `<div class="ad-label">${isNew ? "Tambah" : "Edit"} ${TABS[currentTab]}</div>${fields.map(f => {
      const v = item[f.k] ?? "";
      if (f.t === "image-or-text") {
        const has = v && (String(v).startsWith("http") || String(v).startsWith("data:"));
        return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-f="${f.k}" rows="3" placeholder="Paste URL, teks, atau upload dari galeri...">${esc(v)}</textarea><button type="button" class="ad-img-btn" data-imgt-upload="${f.k}" style="margin-top:8px;justify-content:center;width:100%"><i class="fa-solid fa-image"></i> Upload dari Galeri</button><input type="file" accept="image/*" data-imgt-file="${f.k}" style="display:none"><div class="ad-img-preview" data-imgt-preview="${f.k}" style="display:${has ? 'block' : 'none'};margin-top:8px"><img src="${has ? esc(v) : ''}" onerror="this.parentElement.style.display='none'"></div></div>`;
      }
      if (isImg(f.k) && f.t !== "textarea") {
        return `<div class="ad-field"><label>${esc(f.l)}</label><div class="ad-img-input"><input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="URL / upload..."><button type="button" class="ad-img-btn" data-upload="${f.k}"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-file="${f.k}" style="display:none"><div class="ad-img-preview" data-preview="${f.k}" style="display:${v ? 'block' : 'none'}"><img src="${esc(v)}" onerror="this.parentElement.style.display='none'"></div></div>`;
      }
      if (f.t === "textarea") return `<div class="ad-field"><label>${esc(f.l)}</label><textarea data-f="${f.k}" rows="3">${esc(v)}</textarea></div>`;
      if (f.t === "select") return `<div class="ad-field"><label>${esc(f.l)}</label><select data-f="${f.k}">${f.o.map(o => `<option value="${esc(o)}" ${String(o) == String(v) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
      return `<div class="ad-field"><label>${esc(f.l)}</label><input type="text" data-f="${f.k}" value="${esc(v)}"></div>`;
    }).join("")}<div class="ad-form-actions"><button class="btn btn-ghost" data-cancel style="flex:1">Batal</button><button class="btn btn-primary" data-save style="flex:2"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div>`;

    c.querySelectorAll("[data-imgt-upload]").forEach(btn => btn.onclick = () => c.querySelector(`[data-imgt-file="${btn.dataset.imgtUpload}"]`)?.click());
    c.querySelectorAll("[data-imgt-file]").forEach(inp => inp.onchange = e => {
      const f = e.target.files?.[0]; if (!f) return;
      if (f.size > 2 * 1024 * 1024) { toast("Max 2MB", "error"); return; }
      const rd = new FileReader();
      rd.onload = ev => {
        const k = inp.dataset.imgtFile;
        c.querySelector(`[data-f="${k}"]`).value = ev.target.result;
        const p = c.querySelector(`[data-imgt-preview="${k}"]`);
        if (p) { p.style.display = "block"; p.querySelector("img").src = ev.target.result; }
        toast("OK", "success");
      };
      rd.readAsDataURL(f);
    });
    c.querySelectorAll("[data-upload]").forEach(btn => btn.onclick = () => c.querySelector(`[data-file="${btn.dataset.upload}"]`)?.click());
    c.querySelectorAll("[data-file]").forEach(inp => inp.onchange = e => {
      const f = e.target.files?.[0]; if (!f) return;
      if (f.size > 2 * 1024 * 1024) { toast("Max 2MB", "error"); return; }
      const rd = new FileReader();
      rd.onload = ev => {
        const k = inp.dataset.file;
        c.querySelector(`[data-f="${k}"]`).value = ev.target.result;
        const p = c.querySelector(`[data-preview="${k}"]`);
        if (p) { p.style.display = "block"; p.querySelector("img").src = ev.target.result; }
        toast("OK", "success");
      };
      rd.readAsDataURL(f);
    });
    c.querySelector("[data-cancel]").onclick = () => { editing = null; render(); };
    c.querySelector("[data-save]").onclick = async (e) => {
      const obj = {};
      fields.forEach(f => {
        const el = c.querySelector(`[data-f="${f.k}"]`);
        let v = el ? el.value.trim() : "";
        if (f.k === "adminOnly") v = v === "true";
        obj[f.k] = v;
      });
      if (!obj.name && !obj.label && !obj.id) { toast("Wajib diisi", "error"); return; }
      if (isNew) getCloudData()[currentTab].push(obj);
      else getCloudData()[currentTab][editing.idx] = obj;
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok) { editing = null; if (window.refreshAll) window.refreshAll(); }
    };
  }

  /* ===== THEMES ===== */
  function renderThemes(c) {
    const t = getCloudData().themes?.t1 || {};
    c.innerHTML = `
      <div class="ad-banner" style="background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#60a5fa"><i class="fa-solid fa-circle-info"></i> Tema Monochrome</div>
      <div class="ad-theme-card">
        <div class="ad-theme-head"><div class="ad-theme-title"><div class="ad-theme-color" style="background:linear-gradient(135deg,${t.primary},${t.secondary})"></div><b>${esc(t.name)}</b></div></div>
        <div class="ad-field"><label>Nama</label><input data-th="name" value="${esc(t.name)}"></div>
        <div class="ad-color-grid">
          <div class="ad-field"><label>Primary</label><input data-th="primary" value="${esc(t.primary)}"></div>
          <div class="ad-field"><label>Secondary</label><input data-th="secondary" value="${esc(t.secondary)}"></div>
        </div>
        <div class="ad-field"><label>Background</label><div class="ad-img-input"><input type="text" data-th="bg" value="${esc(t.bgImage || "")}"><button type="button" class="ad-img-btn" data-th-up><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-th-fu style="display:none"><div class="ad-img-preview" data-th-pv style="display:${t.bgImage ? 'block' : 'none'};margin-top:8px"><img src="${esc(t.bgImage || "")}" onerror="this.parentElement.style.display='none'"></div></div>
        <div class="ad-field"><label>Opacity</label><input type="number" step="0.05" min="0" max="1" data-th="opacity" value="${t.bgOpacity || 0.15}"></div>
        <div class="ad-label" style="margin-top:10px">Banner</div>
        <div class="ad-field"><label>Judul</label><input data-th="btitle" value="${esc(t.banner?.title || "")}"></div>
        <div class="ad-field"><label>Deskripsi</label><input data-th="bdesc" value="${esc(t.banner?.desc || "")}"></div>
        <div class="ad-field"><label>URL Banner</label><div class="ad-img-input"><input type="text" data-th="bimg" value="${esc(t.banner?.image || "")}"><button type="button" class="ad-img-btn" data-th-upb><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-th-fub style="display:none"><div class="ad-img-preview" data-th-pvb style="display:${t.banner?.image ? 'block' : 'none'};margin-top:8px"><img src="${esc(t.banner?.image || "")}" onerror="this.parentElement.style.display='none'"></div></div>
        <button class="btn btn-primary btn-block" data-th-save><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      </div>`;

    const bind = (bSel, fSel, tSel, pSel) => {
      const b = c.querySelector(bSel), f = c.querySelector(fSel);
      if (!b || !f) return;
      b.onclick = () => f.click();
      f.onchange = e => {
        const file = e.target.files?.[0]; if (!file) return;
        if (file.size > 2 * 1024 * 1024) { toast("Max 2MB", "error"); return; }
        const rd = new FileReader();
        rd.onload = ev => {
          c.querySelector(tSel).value = ev.target.result;
          const p = c.querySelector(pSel);
          if (p) { p.style.display = "block"; p.querySelector("img").src = ev.target.result; }
          toast("OK", "success");
        };
        rd.readAsDataURL(file);
      };
    };
    bind("[data-th-up]", "[data-th-fu]", '[data-th="bg"]', "[data-th-pv]");
    bind("[data-th-upb]", "[data-th-fub]", '[data-th="bimg"]', "[data-th-pvb]");

    c.querySelector("[data-th-save]").onclick = async (e) => {
      const th = getCloudData().themes.t1;
      const g = k => c.querySelector(`[data-th="${k}"]`).value.trim();
      th.name = g("name") || th.name;
      th.primary = g("primary") || th.primary;
      th.secondary = g("secondary") || th.secondary;
      th.bgImage = g("bg");
      th.bgOpacity = parseFloat(g("opacity")) || 0.15;
      th.banner = { title: g("btitle"), desc: g("bdesc"), image: g("bimg") };
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok && window.applyTheme) window.applyTheme();
    };
  }

  /* ===== PAGES ===== */
  function renderPages(c) {
    const pages = getCloudData().pages || {};
    const ids = Object.keys(pages);
    c.innerHTML = `
      <button class="btn btn-primary ad-list-btn" data-add-p><i class="fa-solid fa-plus"></i> Tambah Page HTML</button>
      <div class="ad-list">
        ${ids.length ? ids.map(id => {
          const p = pages[id];
          const isBuiltin = ["home", "services", "payment", "contact"].includes(id);
          return `<div class="ad-item">
            <div class="ad-item-info"><b>${esc(p.title || id)}</b><small>${esc(id)} · ${isBuiltin ? "BUILTIN" : (p.custom ? "CUSTOM" : "FRAGMENT")}</small></div>
            <div class="ad-item-btns">
              ${p.custom ? `<button data-ed-p="${esc(id)}"><i class="fa-solid fa-pen"></i></button><button class="del" data-del-p="${esc(id)}"><i class="fa-solid fa-trash"></i></button>` : '<span style="font-size:10px;color:var(--muted);padding:0 6px">LOCK</span>'}
            </div>
          </div>`;
        }).join("") : '<div class="ad-empty">Belum ada</div>'}
      </div>`;
    c.querySelector("[data-add-p]").onclick = () => {
      const id = prompt("ID page (lowercase):");
      if (!id || !/^[a-z0-9_-]+$/.test(id)) { toast("Lowercase aja", "error"); return; }
      if (getCloudData().pages[id]) { toast("Dipakai", "error"); return; }
      getCloudData().pages[id] = { title: id, subtitle: "", custom: true, html: "<p>Edit...</p>", customBlocks: [] };
      persistCloud().then(() => render());
    };
    c.querySelectorAll("[data-ed-p]").forEach(b => b.onclick = () => {
      const id = b.dataset.edP;
      const p = getCloudData().pages[id];
      c.innerHTML = `<div class="ad-label">Edit: ${esc(id)}</div><div class="ad-field"><label>Judul</label><input data-pf="title" value="${esc(p.title || "")}"></div><div class="ad-field"><label>Subjudul</label><input data-pf="subtitle" value="${esc(p.subtitle || "")}"></div><div class="ad-field"><label>HTML</label><textarea data-pf="html" rows="8">${esc(p.html || "")}</textarea></div><div class="ad-form-actions"><button class="btn btn-ghost" data-cancel style="flex:1">Batal</button><button class="btn btn-primary" data-save style="flex:2">Simpan</button></div>`;
      c.querySelector("[data-cancel]").onclick = () => render();
      c.querySelector("[data-save]").onclick = async (e) => {
        p.title = c.querySelector("[data-pf='title']").value.trim();
        p.subtitle = c.querySelector("[data-pf='subtitle']").value.trim();
        p.html = c.querySelector("[data-pf='html']").value;
        const ok = await saveBtn(e.target.closest("button"), "Simpan");
        if (ok) render();
      };
    });
    c.querySelectorAll("[data-del-p]").forEach(b => b.onclick = async () => {
      if (!confirm("Hapus page?")) return;
      delete getCloudData().pages[b.dataset.delP];
      await persistCloud();
      render();
    });
  }

  /* ===== PREFS ===== */
  function renderPrefs(c) {
    const p = getCloudData().preferences, d = p.developer || {};
    c.innerHTML = `
      <div class="ad-field"><label>App Name</label><input data-p="appName" value="${esc(p.appName)}"></div>
      <div class="ad-field"><label>Subtitle</label><input data-p="appSubtitle" value="${esc(p.appSubtitle)}"></div>
      <div class="ad-field"><label>Logo</label><div class="ad-img-input"><input type="text" data-p="logo" value="${esc(p.logo || "")}"><button type="button" class="ad-img-btn" data-pup="logo"><i class="fa-solid fa-image"></i></button></div><input type="file" accept="image/*" data-pfu="logo" style="display:none"><div class="ad-img-preview" data-ppv="logo" style="display:${p.logo ? 'block' : 'none'};margin-top:8px"><img src="${esc(p.logo || "")}" onerror="this.parentElement.style.display='none'"></div></div>
      <div class="ad-field"><label>Hero Badge</label><input data-p="heroBadge" value="${esc(p.heroBadge)}"></div>
      <div class="ad-field"><label>Hero Subtitle</label><input data-p="heroSubtitle" value="${esc(p.heroSubtitle)}"></div>
      <div class="ad-field"><label>Hero Rotate (|)</label><textarea data-p="heroRotate" rows="3">${esc((p.heroRotate || []).join(" | "))}</textarea></div>
      <div class="ad-field"><label>Dev Name</label><input data-p="devName" value="${esc(d.name || "")}"></div>
      <div class="ad-field"><label>Username</label><input data-p="devUser" value="${esc(d.username || "")}"></div>
      <div class="ad-field"><label>Role</label><input data-p="devRole" value="${esc(d.role || "")}"></div>
      <div class="ad-field"><label>WhatsApp</label><input data-p="wa" value="${esc(p.contact?.whatsapp || "")}"></div>
      <div class="ad-field"><label>Channel</label><input data-p="channel" value="${esc(p.contact?.channel || "")}"></div>
      <div class="ad-field"><label>Daily Limit Lapor</label><input type="number" data-p="dailyLimit" value="${p.dailyLimit || 5}"></div>
      <div class="ad-field"><label>Webhook</label><input data-p="webhook" value="${esc(p.webhookSaran || "")}"></div>
      <button class="btn btn-primary btn-block" data-psave><i class="fa-solid fa-floppy-disk"></i> Simpan</button>`;

    const bind = f => {
      const btn = c.querySelector(`[data-pup="${f}"]`), file = c.querySelector(`[data-pfu="${f}"]`);
      if (!btn || !file) return;
      btn.onclick = () => file.click();
      file.onchange = e => {
        const fi = e.target.files?.[0]; if (!fi) return;
        if (fi.size > 2 * 1024 * 1024) { toast("Max 2MB", "error"); return; }
        const rd = new FileReader();
        rd.onload = ev => {
          c.querySelector(`[data-p="${f}"]`).value = ev.target.result;
          const pv = c.querySelector(`[data-ppv="${f}"]`);
          if (pv) { pv.style.display = "block"; pv.querySelector("img").src = ev.target.result; }
          toast("OK", "success");
        };
        rd.readAsDataURL(fi);
      };
    };
    bind("logo");

    c.querySelector("[data-psave]").onclick = async (e) => {
      const g = k => c.querySelector(`[data-p="${k}"]`).value.trim();
      p.appName = g("appName") || p.appName;
      p.appSubtitle = g("appSubtitle");
      p.logo = g("logo");
      p.heroBadge = g("heroBadge");
      p.heroSubtitle = g("heroSubtitle");
      p.heroRotate = g("heroRotate").split("|").map(x => x.trim()).filter(Boolean);
      if (!p.developer) p.developer = {};
      p.developer.name = g("devName");
      p.developer.username = g("devUser");
      p.developer.role = g("devRole");
      if (!p.contact) p.contact = {};
      p.contact.whatsapp = g("wa");
      p.contact.channel = g("channel");
      p.dailyLimit = parseInt(g("dailyLimit")) || 5;
      p.webhookSaran = g("webhook");
      const ok = await saveBtn(e.target.closest("button"), '<i class="fa-solid fa-floppy-disk"></i> Simpan');
      if (ok) { if (window.renderPreferences) window.renderPreferences(); if (window.applyLogo) window.applyLogo(); }
    };
  }

  /* ===== WEBSITE ===== */
  function renderWebsite(c) {
    const site = getCloudData().site || {};
    const mode = (site.mode || "open").toLowerCase();
    const info = { open: { l: "ONLINE", cl: "#4ade80", ic: "fa-circle-check" }, maintenance: { l: "MAINT", cl: "#fbbf24", ic: "fa-screwdriver-wrench" }, update: { l: "UPDATE", cl: "#6c7cff", ic: "fa-rocket" } }[mode] || { l: "ONLINE", cl: "#4ade80", ic: "fa-circle-check" };
    c.innerHTML = `
      <div class="ad-banner" style="background:${info.cl}15;border-color:${info.cl}40;color:${info.cl}"><i class="fa-solid ${info.ic}"></i> Status: <b style="margin-left:4px">${info.l}</b></div>
      <div class="ad-mode">
        <button class="btn ${mode === 'open' ? 'btn-primary' : 'btn-ghost'}" data-m="open">Open</button>
        <button class="btn ${mode === 'maintenance' ? 'btn-wa' : 'btn-ghost'}" data-m="maintenance">Maint</button>
        <button class="btn ${mode === 'update' ? 'btn-primary' : 'btn-ghost'}" data-m="update">Update</button>
      </div>
      <div class="ad-field"><label>Pesan</label><textarea data-w="msg" rows="3">${esc(site.maintenanceMessage || "")}</textarea></div>
      <div class="ad-field"><label>ETA</label><input data-w="eta" value="${esc(site.maintenanceEta || "")}" placeholder="30 menit"></div>
      <button class="btn btn-primary btn-block" data-wsave>Simpan</button>`;
    c.querySelectorAll("[data-m]").forEach(b => b.onclick = async () => {
      getCloudData().site.mode = b.dataset.m;
      await persistCloud();
      if (window.checkMaintenance) window.checkMaintenance();
      if (window.checkChangelog) window.checkChangelog();
      toast("Mode: " + b.dataset.m.toUpperCase(), "success");
      render();
    });
    c.querySelector("[data-wsave]").onclick = async (e) => {
      getCloudData().site.maintenanceMessage = c.querySelector("[data-w='msg']").value.trim();
      getCloudData().site.maintenanceEta = c.querySelector("[data-w='eta']").value.trim();
      await saveBtn(e.target.closest("button"), "Simpan");
      if (window.checkMaintenance) window.checkMaintenance();
    };
  }

  /* ===== HISTORY ===== */
  async function renderHistory(c) {
    c.innerHTML = `<div style="text-align:center;padding:20px"><i class="fa-solid fa-spinner fa-spin" style="color:var(--primary);font-size:20px"></i><p style="margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--font-mono)">LOADING...</p></div>`;
    const v = (window.cloudVersions ? await window.cloudVersions() : []) || [];
    if (!v.length) {
      c.innerHTML = `<div class="ad-empty">Belum ada versi tersimpan.<br><small style="font-size:10.5px;color:var(--muted-2)">Version history butuh Worker yang support endpoint /versions.</small></div>`;
      return;
    }
    c.innerHTML = `<div class="ad-label">Versi (${v.length})</div>${v.map(x => `<div class="ad-item"><div class="ad-item-info"><b style="font-size:12px">${new Date(x.timestamp).toLocaleString("id-ID")}</b><small>${x.sha?.substring(0, 8) || "?"}</small></div></div>`).join("")}`;
  }

  /* ===== ACTIONS ===== */
  document.querySelector("[data-ad-act='close']").onclick = closeAdminPanel;
  document.querySelector("[data-ad-act='logout']").onclick = async () => {
    if (!confirm("Logout admin?")) return;
    if (window.clearSession) window.clearSession();
    if (window.applyAdminMode) window.applyAdminMode();
    closeAdminPanel();
    toast("Logout.", "success");
  };
  document.querySelector("[data-ad-act='sync']").onclick = async () => {
    const d = await cloudLoad();
    if (!d) { toast("Gagal sync.", "error"); return; }
    setCloudData(ensureStructure(d));
    if (window.refreshAll) window.refreshAll();
    render();
    toast("Synced.", "success");
  };
  document.querySelector("[data-ad-act='export']").onclick = () => {
    const blob = new Blob([JSON.stringify(getCloudData(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "msi-astra-data.json";
    a.click();
  };

  render();
})();
</script>
