<style>
.dev-tools-wrap { max-width: 1000px; margin: 0 auto; padding-bottom: 60px; animation: fadeIn .4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Banner */
.dev-banner { background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(167,139,250,0.08)); border: 1px solid rgba(96,165,250,0.2); border-radius: 20px; padding: 28px 24px; margin-bottom: 24px; position: relative; overflow: hidden; box-shadow: inset 0 0 20px rgba(96,165,250,0.05); }
.dev-banner::before { content: '>_'; position: absolute; right: 20px; bottom: 10px; font-family: var(--font-mono); font-size: 80px; font-weight: 900; color: rgba(255,255,255,0.03); pointer-events: none; letter-spacing: -5px; }
.dev-banner-title { font-family: var(--font-mono); font-size: 26px; font-weight: 800; color: #60a5fa; letter-spacing: -1px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.dev-banner-title i { font-size: 22px; }
.dev-banner-desc { font-size: 13px; color: var(--muted); max-width: 80%; line-height: 1.6; }

/* Device Info */
.dev-sysinfo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 28px; }
@media(min-width: 600px) { .dev-sysinfo { grid-template-columns: repeat(4, 1fr); } }
.sys-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 14px; transition: .2s; }
.sys-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.sys-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-3); display: grid; place-items: center; color: var(--primary); font-size: 18px; flex-shrink: 0; }
.sys-info { min-width: 0; }
.sys-info b { display: block; font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.2; font-family: var(--font-mono); }
.sys-info small { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; font-weight: 600; }

/* Toolbar */
.tool-toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
@media(min-width: 600px) { .tool-toolbar { flex-direction: row; align-items: center; } }
.tool-search { flex: 1; position: relative; }
.tool-search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.tool-search input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px 12px 44px; color: var(--text); font-family: var(--font-mono); font-size: 13px; outline: none; transition: .2s; }
.tool-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.tool-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.tool-filters::-webkit-scrollbar { display: none; }
.tool-filter-btn { padding: 10px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: .2s; font-family: var(--font-mono); }
.tool-filter-btn.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

/* Grid & Cards */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
@media(min-width: 600px) { .tool-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
.tool-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; cursor: pointer; transition: all .25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; align-items: flex-start; gap: 14px; position: relative; overflow: hidden; }
.tool-card:hover { border-color: var(--primary); background: var(--surface-3); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.tool-card:active { transform: scale(.96); }
.tool-icon-box { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; font-size: 22px; transition: .25s; }
.tool-card:hover .tool-icon-box { transform: scale(1.1); }
.tool-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
.tool-cat { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); margin-top: auto; }

/* Modal Output */
.api-output { margin-top: 16px; display: none; }
.api-output.show { display: block; animation: fadeIn .3s; }
.api-output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.api-output-title { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; font-family: var(--font-mono); }
.api-output-copy { font-size: 10px; background: var(--surface-3); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text); }
.api-pre { white-space: pre-wrap; word-break: break-all; font-family: var(--font-mono); font-size: 11px; line-height: 1.6; color: #4ade80; max-height: 250px; overflow-y: auto; background: #0a0a0c; padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin: 0; }
.api-error { color: #f87171; font-size: 12px; text-align: center; font-weight: 600; padding: 16px; background: rgba(239,68,68,0.1); border-radius: 12px; border: 1px solid rgba(239,68,68,0.2); }
.api-media { width: 100%; border-radius: 12px; margin-bottom: 10px; background: #000; }
</style>

<div class="dev-tools-wrap">
  <div class="dev-banner">
    <div class="dev-banner-title"><i class="fa-solid fa-terminal"></i> Developer Tools</div>
    <div class="dev-banner-desc">Kumpulan API utility dan automasi untuk kebutuhan digital Anda. Sistem secara otomatis mendeteksi parameter GET/POST dan menampilkan media (jika ada).</div>
  </div>

  <div class="dev-sysinfo">
    <div class="sys-card"><div class="sys-icon"><i class="fa-solid fa-battery-half" id="battIcon"></i></div><div class="sys-info"><b id="battLevel">--%</b><small id="battStatus">Checking</small></div></div>
    <div class="sys-card"><div class="sys-icon"><i class="fa-solid fa-memory"></i></div><div class="sys-info"><b id="ramInfo">-- GB</b><small>RAM / Mem</small></div></div>
    <div class="sys-card"><div class="sys-icon"><i class="fa-solid fa-wifi"></i></div><div class="sys-info"><b id="netInfo">--</b><small>Network</small></div></div>
    <div class="sys-card"><div class="sys-icon"><i class="fa-solid fa-laptop"></i></div><div class="sys-info"><b id="osInfo">--</b><small>Platform</small></div></div>
  </div>

  <div class="tool-toolbar">
    <div class="tool-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="toolSearchInput" placeholder="Cari API Tools..."></div>
    <div class="tool-filters" id="toolFilters">
      <button class="tool-filter-btn active" data-cat="all">Semua</button>
      <button class="tool-filter-btn" data-cat="downloader">Downloader</button>
      <button class="tool-filter-btn" data-cat="maker">Maker</button>
      <button class="tool-filter-btn" data-cat="image">Image</button>
      <button class="tool-filter-btn" data-cat="web">Web</button>
      <button class="tool-filter-btn" data-cat="info">Info</button>
    </div>
  </div>

  <div class="tool-grid" id="toolsGrid"></div>
</div>

<div class="modal" id="toolModal">
  <div class="modal-box" style="max-width: 520px; padding: 24px;">
    <button class="modal-close" onclick="document.getElementById('toolModal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
    
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border);">
      <div id="tmIcon" style="width:50px; height:50px; border-radius:14px; background:var(--surface-3); display:grid; place-items:center; font-size:24px; flex-shrink:0;"></div>
      <div><h3 id="tmTitle" style="margin:0; font-size:18px; font-weight:800; color:var(--text);">Tool Name</h3><p id="tmDesc" style="margin:4px 0 0; font-size:12px; color:var(--muted);">Description</p></div>
    </div>
    
    <div id="tmFields" style="display:flex; flex-direction:column; gap:16px;"></div>
    <button class="btn btn-primary btn-block" id="tmRun" style="margin-top:24px; padding:14px; font-size:14px; border-radius:12px; font-weight:700;"><i class="fa-solid fa-play"></i> Eksekusi API</button>
    
    <div class="api-output" id="tmResultBox">
      <div class="api-output-header">
        <div class="api-output-title"><i class="fa-solid fa-code"></i> Response Result</div>
        <button class="api-output-copy" id="tmCopy">Copy Raw</button>
      </div>
      <div id="tmResult"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = window.$, getData = window.getCloudData, toast = window.toast;
  
  /* 1. Device Info */
  async function loadDeviceInfo() {
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        $("#battLevel").textContent = Math.round(b.level * 100) + '%';
        $("#battStatus").textContent = b.charging ? 'Charging' : 'Discharging';
        if(b.level < 0.2 && !b.charging) { $("#battLevel").style.color = '#f87171'; $("#battIcon").style.color = '#f87171'; }
      }
    } catch(e) { $("#battStatus").textContent = 'N/A'; }
    if (navigator.deviceMemory) $("#ramInfo").textContent = navigator.deviceMemory + ' GB';
    if (navigator.connection) $("#netInfo").textContent = navigator.connection.effectiveType.toUpperCase();
    const ua = navigator.userAgent;
    let os = "Unknown";
    if (ua.indexOf("Android") != -1) os = "Android"; else if (ua.indexOf("like Mac") != -1) os = "iOS"; else if (ua.indexOf("Win") != -1) os = "Windows";
    $("#osInfo").textContent = os;
  }
  loadDeviceInfo();

  /* 2. Tools Logic */
  const allTools = (getData()?.tools || []).filter(t => t.enabled !== false);
  let currentCat = 'all', searchQuery = '';

  function renderTools() {
    const grid = $("#toolsGrid");
    let filtered = allTools;
    if (currentCat !== 'all') filtered = filtered.filter(t => t.cat === currentCat);
    if (searchQuery) { const q = searchQuery.toLowerCase(); filtered = filtered.filter(t => t.name.toLowerCase().includes(q) || (t.desc||"").toLowerCase().includes(q)); }

    if (!filtered.length) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);"><i class="fa-solid fa-folder-open fa-2x" style="margin-bottom:10px;opacity:.5"></i><br>Tools tidak ditemukan.</div>';
      return;
    }

    grid.innerHTML = filtered.map(t => `
      <div class="tool-card" data-id="${t.id}">
        <div class="tool-icon-box" style="color:${t.color||'var(--primary)'}"><i class="${t.icon}"></i></div>
        <div class="tool-name">${t.name}</div>
        <div class="tool-cat">${t.cat || 'Utility'}</div>
      </div>
    `).join("");

    grid.querySelectorAll(".tool-card").forEach(c => c.onclick = () => openToolModal(filtered.find(x => x.id === c.dataset.id)));
  }

  function openToolModal(t) {
    const modal = $("#toolModal");
    $("#tmTitle").textContent = t.name;
    $("#tmDesc").textContent = t.desc || "Developer API Endpoint";
    $("#tmIcon").innerHTML = `<i class="${t.icon}" style="color:${t.color||'var(--primary)'}"></i>`;
    $("#tmResultBox").classList.remove("show");
    
    $("#tmFields").innerHTML = (t.params||[]).map(p => `
      <div class="field">
        <label>${p.label || p.key} ${p.required ? '<span style="color:#f87171">*</span>' : ''}</label>
        <input type="${p.type==='url'?'url':'text'}" data-p="${p.key}" placeholder="${p.placeholder||''}">
      </div>
    `).join("");

    $("#tmRun").onclick = async () => {
      const url = new URL(t.api);
      const params = {};
      let valid = true;
      
      (t.params||[]).forEach(p => {
        const el = $("#tmFields").querySelector(`[data-p="${p.key}"]`);
        if(el) {
          if(p.required !== false && !el.value.trim()) { valid = false; el.style.borderColor = '#f87171'; }
          else { el.style.borderColor = 'var(--border)'; }
          if(el.value.trim()) params[p.key] = el.value.trim();
        }
      });
      
      if(!valid) { toast("Mohon isi kolom wajib", "error"); return; }
      
      const btn = $("#tmRun");
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
      $("#tmResultBox").classList.add("show");
      $("#tmResult").innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted); font-family:var(--font-mono); font-size:12px;"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="margin-bottom:10px;"></i><br>Menunggu Response Server...</div>`;
      
      try {
        let fetchUrl = t.api;
        let fetchOpts = { method: 'GET' };

        // Deteksi apakah API menggunakan GET atau POST berdasarkan konfigurasi / default GET
        if (t.method && t.method.toUpperCase() === 'POST') {
            fetchOpts.method = 'POST';
            // Asumsi default POST menggunakan JSON, atau FormData jika di-set
            if (t.bodyType === 'formdata') {
                fetchOpts.body = new FormData();
                Object.keys(params).forEach(k => fetchOpts.body.append(k, params[k]));
            } else {
                fetchOpts.headers = { 'Content-Type': 'application/json' };
                fetchOpts.body = JSON.stringify(params);
            }
        } else {
            Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
            fetchUrl = url.toString();
        }

        const r = await fetch(fetchUrl, fetchOpts);
        const json = await r.json();
        const jsonStr = JSON.stringify(json, null, 2);
        
        // Coba deteksi jika API mengembalikan URL gambar/video untuk ditampilkan
        let mediaHtml = "";
        const strData = JSON.stringify(json);
        const mediaUrlMatch = strData.match(/https?:\/\/[^"\s]+\.(jpg|jpeg|png|gif|mp4|webp)/i);
        
        if(mediaUrlMatch) {
            const mediaUrl = mediaUrlMatch[0];
            if(mediaUrl.match(/\.(mp4)/i)) mediaHtml = `<video src="${mediaUrl}" class="api-media" controls></video>`;
            else mediaHtml = `<img src="${mediaUrl}" class="api-media" alt="Result">`;
        }

        $("#tmResult").innerHTML = `${mediaHtml}<pre class="api-pre">${jsonStr}</pre>`;
        $("#tmCopy").onclick = () => { navigator.clipboard.writeText(jsonStr); toast("JSON Disalin", "success"); };
      } catch(e) {
        $("#tmResult").innerHTML = `<div class="api-error"><i class="fa-solid fa-triangle-exclamation"></i> Gagal: ${e.message}</div>`;
      }
      
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-play"></i> Eksekusi API';
    };
    
    modal.classList.add("show");
  }

  $("#toolSearchInput").addEventListener("input", e => { searchQuery = e.target.value; renderTools(); });
  $("#toolFilters").querySelectorAll(".tool-filter-btn").forEach(b => {
    b.onclick = () => {
      $("#toolFilters").querySelectorAll(".tool-filter-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentCat = b.dataset.cat;
      renderTools();
    };
  });

  renderTools();
})();
</script>
