<style>
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:10px 0}
.tool-card{padding:16px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:center;transition:all .2s}
.tool-card:active{transform:scale(.95);border-color:var(--primary)}
.tool-icon{width:48px;height:48px;margin:0 auto 10px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;font-size:22px;color:var(--primary)}
.tool-name{font-size:12px;font-weight:700}
</style>

<div style="margin-bottom:20px">
  <h2 style="font-size:20px;font-weight:800">Tools Online</h2>
  <p style="font-size:12px;color:var(--muted)">Kumpulan alat bantu digital.</p>
</div>
<div class="tool-grid" id="toolsGrid"></div>

<div class="modal" id="toolModal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('toolModal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
    <h3 id="tmTitle" style="margin-bottom:14px;font-size:16px;color:var(--primary)">Tool Name</h3>
    <div id="tmFields"></div>
    <button class="btn btn-primary btn-block" id="tmRun" style="margin-top:12px"><i class="fa-solid fa-play"></i> Proses</button>
    <div id="tmResult" style="margin-top:14px;font-size:12px;color:var(--muted)"></div>
  </div>
</div>

<script>
(function(){
  const $ = window.$, getData = window.getCloudData, toast = window.toast;
  const grid = $("#toolsGrid");
  if(!grid) return;

  const tools = (getData()?.tools || []).filter(t => t.enabled !== false);

  grid.innerHTML = tools.map(t => `
    <div class="tool-card" data-id="${t.id}">
      <div class="tool-icon" style="color:${t.color||'var(--primary)'}"><i class="${t.icon}"></i></div>
      <div class="tool-name">${t.name}</div>
    </div>
  `).join("") || '<p style="color:var(--muted);grid-column:1/-1;text-align:center">Belum ada tools aktif.</p>';

  grid.querySelectorAll(".tool-card").forEach(c => c.onclick = () => {
    const t = tools.find(x => x.id === c.dataset.id);
    const modal = $("#toolModal");
    $("#tmTitle").textContent = t.name;
    $("#tmResult").innerHTML = "";
    
    // Render Input Fields
    $("#tmFields").innerHTML = (t.params||[]).map(p => `
      <div class="field"><label>${p.label||p.key}</label><input type="${p.type==='url'?'url':'text'}" data-p="${p.key}" placeholder="${p.placeholder||''}"></div>
    `).join("");

    // Run Button Logic
    $("#tmRun").onclick = async () => {
      const url = new URL(t.api);
      (t.params||[]).forEach(p => {
        const el = $("#tmFields").querySelector(`[data-p="${p.key}"]`);
        if(el && el.value) url.searchParams.set(p.key, el.value);
      });
      
      $("#tmResult").innerHTML = `<div style="text-align:center;padding:20px"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Memproses...</div>`;
      $("#tmRun").disabled = true;
      
      try {
        const r = await fetch(url.toString());
        const j = await r.json();
        $("#tmResult").innerHTML = `<pre style="white-space:pre-wrap;font-size:10.5px;max-height:200px;overflow-y:auto;background:#000;padding:12px;border-radius:10px;border:1px solid var(--border);color:#4ade80">${JSON.stringify(j,null,2)}</pre>`;
      } catch(e) {
        $("#tmResult").innerHTML = `<p style="color:#f87171;text-align:center">Gagal: ${e.message}</p>`;
      }
      $("#tmRun").disabled = false;
    };
    modal.classList.add("show");
  });
})();
</script>
