<style>
/* ═══ MODERN TOOLS UI ═══ */
.tw-container { max-width: 1000px; margin: 0 auto; padding-bottom: 60px; animation: fadeIn .4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Elegant Banner */
.tw-banner { background: linear-gradient(135deg, rgba(96,165,250,0.1), rgba(167,139,250,0.05)); border: 1px solid rgba(96,165,250,0.15); border-radius: 24px; padding: 32px 28px; margin-bottom: 16px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); backdrop-filter: blur(10px); }
.tw-banner::before { content: 'API'; position: absolute; right: 20px; bottom: -20px; font-family: var(--font-mono); font-size: 120px; font-weight: 900; color: rgba(255,255,255,0.02); pointer-events: none; letter-spacing: -5px; }
.tw-banner-title { font-family: var(--font-mono); font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -1px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.tw-banner-title i { color: #60a5fa; }
.tw-banner-desc { font-size: 13.5px; color: #a1a1aa; max-width: 80%; line-height: 1.6; }

/* Compact Device Info */
.tw-device-bar { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 28px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.tw-dev-item { display: flex; align-items: center; gap: 6px; }
.tw-dev-item i { color: var(--primary); font-size: 13px; }
.tw-dev-item b { color: #fff; font-weight: 600; }

/* Toolbar */
.tw-toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
@media(min-width: 600px) { .tw-toolbar { flex-direction: row; align-items: center; } }
.tw-search { flex: 1; position: relative; }
.tw-search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.tw-search input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 14px 44px; color: var(--text); font-family: var(--font-mono); font-size: 13px; outline: none; transition: .3s; }
.tw-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.tw-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.tw-filters::-webkit-scrollbar { display: none; }
.tw-filter { padding: 10px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: .2s; font-family: var(--font-mono); }
.tw-filter.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

/* Grid */
.tw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
@media(min-width: 600px) { .tw-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
.tw-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; cursor: pointer; transition: all .3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; align-items: flex-start; gap: 14px; position: relative; overflow: hidden; }
.tw-card:hover { border-color: var(--primary); background: var(--surface-3); transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }
.tw-card:active { transform: scale(.96); }
.tw-icon-box { width: 46px; height: 46px; border-radius: 12px; background: var(--surface-3); display: grid; place-items: center; font-size: 20px; transition: .3s; }
.tw-card:hover .tw-icon-box { transform: scale(1.1); background: var(--primary-soft); }
.tw-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
.tw-cat { font-size: 9px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); margin-top: auto; }

/* Result UI */
.tw-result-box { margin-top: 20px; display: none; animation: fadeIn .3s; }
.tw-result-box.show { display: block; }
.tw-media-preview { width: 100%; border-radius: 14px; background: #000; border: 1px solid var(--border); margin-bottom: 12px; }
.tw-dl-group { display: flex; flex-direction: column; gap: 8px; }
.tw-dl-btn { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 12.5px; font-weight: 600; transition: .2s; }
.tw-dl-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.tw-dl-btn i { font-size: 16px; }
.tw-dl-btn span { flex: 1; margin-left: 10px; text-align: left; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.tw-error { padding: 16px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; color: #f87171; font-size: 12px; text-align: center; font-family: var(--font-mono); }
</style>

<div class="tw-container">
  <!-- Banner -->
  <div class="tw-banner">
    <div class="tw-banner-title"><i class="fa-solid fa-code"></i> Developer API Hub</div>
    <div class="tw-banner-desc">Kumpulan alat automasi dan utility canggih. Sistem secara otomatis mem-parsing respons API ke dalam bentuk visual yang rapi.</div>
  </div>

  <!-- Device Info (Compact) -->
  <div class="tw-device-bar">
    <div class="tw-dev-item"><i class="fa-solid fa-battery-half" id="twBatt"></i> <span>Batt: <b id="twBattVal">--%</b></span></div>
    <div class="tw-dev-item"><i class="fa-solid fa-memory"></i> <span>RAM: <b id="twRam">--</b></span></div>
    <div class="tw-dev-item"><i class="fa-solid fa-wifi"></i> <span>Net: <b id="twNet">--</b></span></div>
    <div class="tw-dev-item"><i class="fa-solid fa-microchip"></i> <span>OS: <b id="twOs">--</b></span></div>
  </div>

  <!-- Toolbar -->
  <div class="tw-toolbar">
    <div class="tw-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="twSearch" placeholder="Cari tools..."></div>
    <div class="tw-filters" id="twFilters">
      <button class="tw-filter active" data-cat="all">Semua</button>
      <button class="tw-filter" data-cat="downloader">Downloader</button>
      <button class="tw-filter" data-cat="maker">Maker</button>
      <button class="tw-filter" data-cat="image">Image</button>
      <button class="tw-filter" data-cat="web">Web</button>
      <button class="tw-filter" data-cat="info">Info</button>
    </div>
  </div>

  <div class="tw-grid" id="twGrid"></div>
</div>

<!-- Modal -->
<div class="modal" id="twModal">
  <div class="modal-box" style="max-width: 500px; padding: 24px;">
    <button class="modal-close" onclick="document.getElementById('twModal').classList.remove('show')"><i class="fa-solid fa-xmark"></i></button>
    
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border);">
      <div id="twMIcon" style="width:50px; height:50px; border-radius:14px; background:var(--surface-3); display:grid; place-items:center; font-size:24px; flex-shrink:0;"></div>
      <div><h3 id="twMTitle" style="margin:0; font-size:18px; font-weight:800; color:var(--text);">Tool Name</h3><p id="twMDesc" style="margin:4px 0 0; font-size:12px; color:var(--muted);">Description</p></div>
    </div>
    
    <div id="twFields" style="display:flex; flex-direction:column; gap:16px;"></div>
    <button class="btn btn-primary btn-block" id="twRun" style="margin-top:20px; padding:14px; font-size:14px; border-radius:12px; font-weight:700;"><i class="fa-solid fa-bolt"></i> Proses API</button>
    
    <div class="tw-result-box" id="twResultBox">
      <div id="twResultContent"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = window.$, getData = window.getCloudData, toast = window.toast;
  
  /* 1. Device Info Logic */
  async function loadDevice() {
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        $("#twBattVal").textContent = Math.round(b.level * 100) + '%';
        if(b.level < 0.2) $("#twBatt").style.color = '#f87171';
      }
    } catch(e) {}
    if (navigator.deviceMemory) $("#twRam").textContent = navigator.deviceMemory + ' GB';
    if (navigator.connection) $("#twNet").textContent = navigator.connection.effectiveType.toUpperCase();
    const ua = navigator.userAgent;
    let os = "Unknown";
    if (ua.indexOf("Android") != -1) os = "Android"; else if (ua.indexOf("like Mac") != -1) os = "iOS"; else if (ua.indexOf("Win") != -1) os = "Windows";
    $("#twOs").textContent = os;
  }
  loadDevice();

  /* 2. Tools Logic */
  const allTools = (getData()?.tools || []).filter(t => t.enabled !== false);
  let currentCat = 'all', searchQuery = '';

  function renderTools() {
    const grid = $("#twGrid");
    let filtered = allTools;
    if (currentCat !== 'all') filtered = filtered.filter(t => t.cat === currentCat);
    if (searchQuery) { const q = searchQuery.toLowerCase(); filtered = filtered.filter(t => t.name.toLowerCase().includes(q)); }

    if (!filtered.length) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);"><i class="fa-solid fa-folder-open fa-2x" style="margin-bottom:10px;opacity:.5"></i><br>Tools tidak ditemukan.</div>';
      return;
    }

    grid.innerHTML = filtered.map(t => `
      <div class="tw-card" data-id="${t.id}">
        <div class="tw-icon-box" style="color:${t.color||'var(--primary)'}"><i class="${t.icon}"></i></div>
        <div class="tw-name">${t.name}</div>
        <div class="tw-cat">${t.cat || 'Utility'}</div>
      </div>
    `).join("");

    grid.querySelectorAll(".tw-card").forEach(c => c.onclick = () => openModal(filtered.find(x => x.id === c.dataset.id)));
  }

  function openModal(t) {
    const modal = $("#twModal");
    $("#twMTitle").textContent = t.name;
    $("#twMDesc").textContent = t.desc || "Developer API Endpoint";
    $("#twMIcon").innerHTML = `<i class="${t.icon}" style="color:${t.color||'var(--primary)'}"></i>`;
    $("#twResultBox").classList.remove("show");
    
    $("#twFields").innerHTML = (t.params||[]).map(p => `
      <div class="field">
        <label>${p.label || p.key} ${p.required ? '<span style="color:#f87171">*</span>' : ''}</label>
        <input type="${p.type==='url'?'url':'text'}" data-p="${p.key}" placeholder="${p.placeholder||''}">
      </div>
    `).join("");

    $("#twRun").onclick = async () => {
      const params = {};
      let valid = true;
      
      (t.params||[]).forEach(p => {
        const el = $("#twFields").querySelector(`[data-p="${p.key}"]`);
        if(el) {
          if(p.required !== false && !el.value.trim()) { valid = false; el.style.borderColor = '#f87171'; }
          else { el.style.borderColor = 'var(--border)'; }
          if(el.value.trim()) params[p.key] = el.value.trim();
        }
      });
      
      if(!valid) { toast("Lengkapi kolom wajib", "error"); return; }
      
      const btn = $("#twRun");
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';
      $("#twResultBox").classList.add("show");
      $("#twResultContent").innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted); font-family:var(--font-mono); font-size:12px;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom:10px;"></i><br>Menghubungi API...</div>`;
      
      try {
        // Build URL
        const url = new URL(t.api);
        // Khusus beberapa API yang emang butuh GET query
        Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
        
        // Fetch (dengan fallback CORS Proxy jika diblokir browser)
        let res;
        try {
            res = await fetch(url.toString());
            if(!res.ok) throw new Error("HTTP " + res.status);
        } catch (err) {
            // Fallback ke CORS Proxy
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url.toString())}`;
            res = await fetch(proxy);
            if(!res.ok) throw new Error("Proxy Error: " + res.status);
        }

        const json = await res.json();
        renderResult(json, t.cat);
        
      } catch(e) {
        $("#twResultContent").innerHTML = `<div class="tw-error"><i class="fa-solid fa-triangle-exclamation"></i> Gagal memproses: ${e.message}<br>API mungkin sedang down atau memblokir akses.</div>`;
      }
      
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Proses API';
    };
    
    modal.classList.add("show");
  }

  // Parser JSON menjadi UI (Tanpa raw JSON)
  function renderResult(data, category) {
    let html = "";
    let mediaUrl = null;
    let dlLinks = [];
    
    // Recursive function untuk cari URL media
    function extract(obj) {
        if(!obj) return;
        if(typeof obj === 'string') {
            if(obj.match(/^https?:\/\/.+\.(mp4|m4a|mp3)/i)) dlLinks.push({ type: 'video', url: obj });
            else if(obj.match(/^https?:\/\/.+\.(jpg|jpeg|png|webp|gif)/i)) dlLinks.push({ type: 'image', url: obj });
            else if(obj.match(/^https?:\/\//i)) dlLinks.push({ type: 'link', url: obj });
            return;
        }
        if(Array.isArray(obj)) { obj.forEach(extract); return; }
        if(typeof obj === 'object') { Object.values(obj).forEach(extract); }
    }
    extract(data);

    // Deduplikasi link
    dlLinks = dlLinks.filter((v,i,a) => a.findIndex(t => t.url === v.url) === i);

    // Tampilkan Preview Media Pertama (Video atau Gambar)
    if (dlLinks.length > 0) {
        const first = dlLinks[0];
        if (first.type === 'video') {
            html += `<video src="${first.url}" class="tw-media-preview" controls preload="metadata"></video>`;
        } else if (first.type === 'image') {
            html += `<img src="${first.url}" class="tw-media-preview" alt="Preview" onerror="this.style.display='none'">`;
        }
    }

    // Tampilkan Tombol Download / Link
    if (dlLinks.length > 0) {
        html += `<div class="tw-dl-group">`;
        dlLinks.forEach((link, i) => {
            let icon = "fa-link", label = "Buka Link";
            if(link.type === 'video') { icon = "fa-video"; label = "Download Video (MP4/MP3)"; }
            if(link.type === 'image') { icon = "fa-image"; label = "Download Gambar"; }
            html += `<a href="${link.url}" target="_blank" class="tw-dl-btn">
                <i class="fa-solid ${icon}"></i> <span>${label} #${i+1}</span> <i class="fa-solid fa-download"></i>
            </a>`;
        });
        html += `</div>`;
    } 
    
    // Jika tidak ada media/link, tapi ada teks (untuk info / AI)
    else if (data.result || data.message || data.data) {
        const text = typeof data.result === 'string' ? data.result : (typeof data.message === 'string' ? data.message : JSON.stringify(data.data));
        html += `<div style="background:var(--surface-3); padding:16px; border-radius:12px; font-size:12.5px; line-height:1.6; color:var(--text); white-space:pre-wrap;">${text}</div>`;
    } 
    
    // Fallback terakhir jika JSON tidak dikenali (tapi tetap dirapikan)
    else {
        html += `<div class="tw-error">Data diterima, tetapi format tidak dikenali sebagai media atau teks.</div>`;
    }

    $("#twResultContent").innerHTML = html;
  }

  $("#twSearch").addEventListener("input", e => { searchQuery = e.target.value; renderTools(); });
  $("#twFilters").querySelectorAll(".tw-filter").forEach(b => {
    b.onclick = () => {
      $("#twFilters").querySelectorAll(".tw-filter").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentCat = b.dataset.cat;
      renderTools();
    };
  });

  renderTools();
})();
</script>
