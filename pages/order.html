<div class="order-page">
  <div class="order-store-bar">
    <div class="order-store-info">
      <div class="order-store-name">Store<span class="sep">/</span>Digital</div>
      <div class="order-store-status">online</div>
    </div>
    <div class="order-store-menu"><i class="fa-solid fa-bars"></i></div>
  </div>

  <div class="order-badge">Premium Store</div>

  <h1 class="order-headline">order <span class="accent">digital</span><br>cepat & otomatis</h1>
  <p class="order-desc">Pilih produk, lihat detail harga & durasi, scan QR untuk bayar.</p>

  <div class="order-stats">
    <div class="order-stat">
      <div class="order-stat-icon green"><i class="fa-solid fa-box"></i></div>
      <div>
        <div class="order-stat-num" id="orderStatProducts">0</div>
        <div class="order-stat-label">Produk</div>
      </div>
    </div>
    <div class="order-stat">
      <div class="order-stat-icon purple"><i class="fa-solid fa-clock"></i></div>
      <div>
        <div class="order-stat-num">24/7</div>
        <div class="order-stat-label">Store</div>
      </div>
    </div>
    <div class="order-stat">
      <div class="order-stat-icon orange"><i class="fa-solid fa-qrcode"></i></div>
      <div>
        <div class="order-stat-num">QRIS</div>
        <div class="order-stat-label">Bayar</div>
      </div>
    </div>
  </div>

  <div class="order-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="orderSearch" placeholder="Cari produk...">
  </div>

  <div class="order-cats" id="orderCats">
    <button class="order-cat active" data-cat="all"><i class="fa-solid fa-layer-group"></i> Semua</button>
    <button class="order-cat" data-cat="jasa"><i class="fa-solid fa-screwdriver-wrench"></i> Jasa</button>
    <button class="order-cat" data-cat="produk"><i class="fa-solid fa-box"></i> Produk</button>
  </div>

  <div class="order-section-title">pilih produk</div>
  <div class="order-products" id="orderProducts"></div>
</div>
